<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>행운 원기옥 (Luck Collector)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Jua', sans-serif;
      background-color: #1a202c;
      color: white;
      overflow: hidden; /* 스크롤 방지 */
      touch-action: none; /* 모바일 브라우저 기본 제스처 방지 */
    }

    #canvas-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* 행운 볼 효과 */
    .luck-ball {
      transition: all 0.5s ease-out;
      box-shadow: 0 0 20px #48dbfb, 0 0 40px #48dbfb inset;
      background: radial-gradient(circle, #c7ecee 0%, #48dbfb 70%, #0abde3 100%);
    }

    /* 악마와 천사 기본 스타일 */
    .character {
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 0.1s;
    }

    /* 구름 말풍선 공통 스타일 */
    .bubble {
      position: absolute;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 1.1rem;
      pointer-events: none;
      white-space: pre-wrap;
      max-width: 200px;
      word-break: break-all;
      z-index: 5;
      transition: opacity 0.2s, filter 0.2s, transform 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .stress-bubble {
      background: rgba(45, 52, 54, 0.9);
      color: #ff7675;
      border: 2px solid #d63031;
    }

    .happy-bubble {
      background: rgba(255, 255, 255, 0.9);
      color: #f39c12;
      border: 2px solid #f1c40f;
    }

    /* 도구 선택 UI */
    .tool-btn.active {
      border-color: #ff7675;
      background-color: rgba(255, 118, 117, 0.2);
    }

    .tnt-block {
      position: absolute;
      font-size: 3rem;
      cursor: pointer;
      z-index: 8;
      user-select: none;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen relative">

  <!-- 파티클 이펙트용 캔버스 -->
  <canvas id="canvas-container"></canvas>

  <!-- 상단 헤더 및 점수 -->
  <header class="w-full p-4 flex flex-col items-center z-20 bg-gray-900 bg-opacity-50">
    <h1 class="text-3xl text-blue-300 drop-shadow-md">행운 원기옥</h1>
    <div class="text-xl mt-2">행운 에너지: <span id="score-display" class="text-yellow-400 font-bold">0</span></div>
    <div id="message-display" class="text-sm text-gray-300 mt-2 h-6 transition-opacity duration-500"></div>
  </header>

  <!-- 메인 게임 영역 -->
  <main class="flex-1 flex flex-col md:flex-row w-full relative z-20">
    
    <!-- 왼쪽: 악마 (스트레스 존) -->
    <section class="flex-1 border-b md:border-b-0 md:border-r border-gray-700 flex flex-col items-center justify-end relative overflow-hidden" id="devil-zone">
      <div class="absolute top-4 w-full px-4 flex gap-2 z-30">
        <input type="text" id="stress-input" placeholder="무슨 일이 있었나요?" class="flex-1 p-2 rounded bg-gray-800 border border-red-500 text-white outline-none focus:ring-2 focus:ring-red-500">
        <button id="stress-btn" class="p-2 bg-red-600 rounded hover:bg-red-500 transition">🤬</button>
      </div>
      
      <!-- 도구 선택바 -->
      <div class="absolute left-4 top-20 flex flex-col gap-2 z-30">
        <button id="tool-hand" class="tool-btn active w-12 h-12 rounded-full border-2 border-gray-500 bg-gray-800 text-2xl flex items-center justify-center">🖐️</button>
        <button id="tool-tnt" class="tool-btn w-12 h-12 rounded-full border-2 border-gray-500 bg-gray-800 text-2xl flex items-center justify-center">🧨</button>
      </div>

      <div id="devil-area" class="w-full h-full absolute top-0 left-0"></div>
      
      <!-- 악마 캐릭터 -->
      <div id="devil" class="character text-8xl absolute bottom-10 cursor-pointer drop-shadow-2xl">👿</div>
    </section>

    <!-- 중앙: 행운 볼 -->
    <section class="w-full md:w-1/3 h-48 md:h-full flex items-center justify-center relative pointer-events-none z-10 flex-shrink-0 bg-gray-900 border-y md:border-y-0 border-gray-700">
      <div id="luck-ball" class="luck-ball rounded-full w-10 h-10 flex items-center justify-center">
        <span class="text-white opacity-50 text-sm">🍀</span>
      </div>
    </section>

    <!-- 오른쪽: 천사 (행운 존) -->
    <section class="flex-1 flex flex-col items-center justify-end relative overflow-hidden" id="angel-zone">
      <div class="absolute top-4 w-full px-4 flex gap-2 z-30">
        <input type="text" id="happy-input" placeholder="사소한 행운이나 기쁜 일" class="flex-1 p-2 rounded bg-gray-800 border border-yellow-400 text-white outline-none focus:ring-2 focus:ring-yellow-400">
        <button id="happy-btn" class="p-2 bg-yellow-500 rounded hover:bg-yellow-400 transition text-black">✨</button>
      </div>
      
      <div id="angel-area" class="w-full h-full absolute top-0 left-0"></div>

      <!-- 천사 캐릭터 -->
      <div id="angel" class="character text-8xl absolute bottom-10 cursor-grab drop-shadow-2xl">👼</div>
    </section>

  </main>

  <script>
    // 상태 관리
    let points = parseInt(localStorage.getItem('luckCollector_points')) || 0;
    let currentTool = 'hand'; // 'hand' or 'tnt'
    
    // DOM 요소
    const scoreDisplay = document.getElementById('score-display');
    const messageDisplay = document.getElementById('message-display');
    const luckBall = document.getElementById('luck-ball');
    const devil = document.getElementById('devil');
    const angel = document.getElementById('angel');
    const devilZone = document.getElementById('devil-zone');
    const angelZone = document.getElementById('angel-zone');
    const canvas = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d');

    // 입력 관련 DOM
    const stressInput = document.getElementById('stress-input');
    const stressBtn = document.getElementById('stress-btn');
    const happyInput = document.getElementById('happy-input');
    const happyBtn = document.getElementById('happy-btn');

    // 도구 관련 DOM
    const toolHand = document.getElementById('tool-hand');
    const toolTnt = document.getElementById('tool-tnt');

    // 말풍선 및 파티클 배열
    let stressBubbles = [];
    let happyBubbles = [];
    let particles = [];
    let tntBlocks = [];

    // 오디오 컨텍스트 (Web Audio API) - 클릭 시 초기화
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // --- 사운드 합성 함수 ---
    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playExplosionSound() {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 0.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playHealSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // --- 유틸리티 ---
    function triggerVibration(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function updateScore(amount) {
      points += amount;
      if (points < 0) points = 0;
      localStorage.setItem('luckCollector_points', points);
      scoreDisplay.innerText = points.toLocaleString();
      updateLuckBall();
      updateMessage();
    }

    function updateLuckBall() {
      // 0 ~ 10000 포인트를 기준으로 40px ~ 300px 크기로 변경
      const minSize = 40;
      const maxSize = 300;
      let scale = minSize + (points / 10000) * (maxSize - minSize);
      if (scale > maxSize) scale = maxSize + Math.log(points - 10000 + 1) * 5; // 최대 초과 시 천천히 증가
      
      luckBall.style.width = `${scale}px`;
      luckBall.style.height = `${scale}px`;
      
      // 색상 및 글로우 이펙트 강화
      const intensity = Math.min(1, points / 5000);
      luckBall.style.boxShadow = `0 0 ${20 + intensity*50}px #48dbfb, 0 0 ${40 + intensity*100}px #48dbfb inset`;
    }

    function updateMessage() {
      if (points === 0) {
        messageDisplay.innerText = "내 기도가 닿았구나! 정말 기뻐! ✨";
        messageDisplay.style.color = "#f1c40f";
        return;
      }
      
      messageDisplay.style.color = "#d1d5db"; // 텍스트 색상 복구
      if (points > 10000) {
        messageDisplay.innerText = "우주가 당신에게 빚을 졌네요. 거대한 원기옥이 앞날을 비춰줄 거예요.";
      } else if (points > 5000) {
        messageDisplay.innerText = "당신의 인내심이 눈부신 행운으로 변하고 있습니다.";
      } else if (points > 1000) {
        messageDisplay.innerText = "오늘 하루도 고생 많았어요. 행운이 모이고 있습니다.";
      } else {
        messageDisplay.innerText = "";
      }
    }

    // --- 캔버스 크기 조정 ---
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- 파티클 시스템 ---
    class Particle {
      constructor(x, y, color, type) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type; // 'stress', 'happy', 'explosion'
        this.size = Math.random() * 5 + 2;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        if (type === 'happy') this.vy = -Math.abs(this.vy) - 2; // 위로 상승
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.02;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.type !== 'happy') this.vy += 0.2; // 중력
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    function createParticles(x, y, color, type, amount) {
      for (let i = 0; i < amount; i++) {
        particles.push(new Particle(x, y, color, type));
      }
    }

    // --- 말풍선 시스템 ---
    function addStressBubble(text) {
      const el = document.createElement('div');
      el.className = 'bubble stress-bubble';
      el.innerText = text;
      
      // 랜덤 위치 (Devil 구역 내부 상단)
      const zoneRect = devilZone.getBoundingClientRect();
      const randomX = Math.random() * (zoneRect.width - 150);
      const randomY = Math.random() * (zoneRect.height / 2) + 50;
      
      el.style.left = `${randomX}px`;
      el.style.top = `${randomY}px`;
      devilZone.appendChild(el);
      
      stressBubbles.push({ el, health: 100 });
    }

    function addHappyBubble(text) {
      const el = document.createElement('div');
      el.className = 'bubble happy-bubble';
      el.innerText = text;
      
      const zoneRect = angelZone.getBoundingClientRect();
      const randomX = Math.random() * (zoneRect.width - 150);
      
      // 천사 위치 근처에서 시작
      el.style.left = `${randomX}px`;
      el.style.top = `${zoneRect.height - 150}px`;
      angelZone.appendChild(el);
      
      happyBubbles.push({ el, y: zoneRect.height - 150, glow: 0 });
    }

    stressBtn.addEventListener('click', () => {
      initAudio();
      if (stressInput.value.trim()) {
        addStressBubble(stressInput.value);
        stressInput.value = '';
      }
    });

    happyBtn.addEventListener('click', () => {
      initAudio();
      if (happyInput.value.trim()) {
        addHappyBubble(happyInput.value);
        happyInput.value = '';
      }
    });

    // 엔터키 지원
    stressInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') stressBtn.click(); });
    happyInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') happyBtn.click(); });

    // --- 도구 선택 로직 ---
    toolHand.addEventListener('click', () => {
      currentTool = 'hand';
      toolHand.classList.add('active');
      toolTnt.classList.remove('active');
    });
    toolTnt.addEventListener('click', () => {
      currentTool = 'tnt';
      toolTnt.classList.add('active');
      toolHand.classList.remove('active');
    });

    // --- TNT 로직 ---
    devilZone.addEventListener('click', (e) => {
      // 버튼류나 입력창 클릭 시 무시
      if (e.target.closest('button') || e.target.closest('input')) return;
      
      if (currentTool === 'tnt' && e.target.id !== 'devil' && !e.target.classList.contains('tnt-block')) {
        const rect = devilZone.getBoundingClientRect();
        const tnt = document.createElement('div');
        tnt.className = 'tnt-block';
        tnt.innerText = '🧨';
        tnt.style.left = `${e.clientX - rect.left - 25}px`;
        tnt.style.top = `${e.clientY - rect.top - 25}px`;
        
        tnt.addEventListener('click', (ev) => {
          ev.stopPropagation();
          explodeTNT(tnt, ev.clientX, ev.clientY);
        });
        
        devilZone.appendChild(tnt);
        tntBlocks.push(tnt);
      }
    });

    function explodeTNT(tntEl, x, y) {
      initAudio();
      playExplosionSound();
      triggerVibration([100, 50, 200, 50, 300]);
      
      createParticles(x, y, '#ff9f43', 'explosion', 100);
      createParticles(x, y, '#ee5253', 'explosion', 50);
      
      tntEl.remove();
      
      // 모든 스트레스 말풍선에 큰 데미지
      stressBubbles.forEach(bubble => {
        bubble.health -= 50;
      });
      
      // 악마 흔들림 효과
      devil.style.transform = `scale(1.2) rotate(${(Math.random()-0.5)*45}deg)`;
      devil.innerText = '🤯';
      setTimeout(() => {
        devil.style.transform = 'scale(1) rotate(0deg)';
        devil.innerText = '👿';
      }, 300);

      updateScore(500);
      checkStressBubbles();
    }

    // --- 악마 타격/드래그 로직 (스트레스 적립) ---
    let isDraggingDevil = false;
    let devilX = 0, devilY = 0;
    let devilVlX = 0, devilVlY = 0;
    let lastMouseX = 0, lastMouseY = 0;

    function damageDevil(x, y, multiplier = 1) {
      initAudio();
      playHitSound();
      triggerVibration(50);
      
      devil.innerText = '😖';
      devil.style.transform = `scale(0.9) translate(${(Math.random()-0.5)*20}px, ${(Math.random()-0.5)*20}px)`;
      
      setTimeout(() => {
        if (!isDraggingDevil) {
          devil.innerText = '👿';
          devil.style.transform = 'scale(1) translate(0, 0)';
        }
      }, 150);

      const rect = devil.getBoundingClientRect();
      createParticles(rect.left + rect.width/2, rect.top + rect.height/2, '#d63031', 'stress', 10 * multiplier);

      // 말풍선 타격
      stressBubbles.forEach(bubble => {
        bubble.health -= 15 * multiplier;
      });
      checkStressBubbles();
      updateScore(10 * multiplier);
    }

    function checkStressBubbles() {
      stressBubbles = stressBubbles.filter(bubble => {
        if (bubble.health <= 0) {
          bubble.el.style.transform = 'scale(1.5)';
          bubble.el.style.opacity = '0';
          setTimeout(() => bubble.el.remove(), 200);
          return false;
        } else {
          bubble.el.style.opacity = bubble.health / 100;
          bubble.el.style.filter = `blur(${(100 - bubble.health)/20}px)`;
          return true;
        }
      });
    }

    // 악마 클릭 (터치/마우스)
    devil.addEventListener('mousedown', startDevilDrag);
    devil.addEventListener('touchstart', (e) => { e.preventDefault(); startDevilDrag(e.touches[0]); }, {passive: false});

    function startDevilDrag(e) {
      if (currentTool !== 'hand') return;
      isDraggingDevil = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      damageDevil(e.clientX, e.clientY);
    }

    window.addEventListener('mousemove', dragDevil);
    window.addEventListener('touchmove', (e) => { if(isDraggingDevil) dragDevil(e.touches[0]); }, {passive: false});

    function dragDevil(e) {
      if (!isDraggingDevil) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      devilX += dx;
      devilY += dy;
      devil.style.transform = `translate(${devilX}px, ${devilY}px) scale(1.1)`;
      
      devilVlX = dx;
      devilVlY = dy;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;

      // 벽에 부딪힐 때 타격 판정
      const rect = devil.getBoundingClientRect();
      const zoneRect = devilZone.getBoundingClientRect();
      if (rect.left < zoneRect.left || rect.right > zoneRect.right || rect.top < zoneRect.top || rect.bottom > zoneRect.bottom) {
        damageDevil(e.clientX, e.clientY, 3); // 벽 충돌은 데미지 3배
        // 안으로 살짝 밀어넣기
        devilX *= 0.8; 
        devilY *= 0.8;
      }
    }

    window.addEventListener('mouseup', stopDevilDrag);
    window.addEventListener('touchend', stopDevilDrag);

    function stopDevilDrag() {
      if (isDraggingDevil) {
        isDraggingDevil = false;
        // 제자리로 애니메이션 복귀
        devil.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        devilX = 0; devilY = 0;
        devil.style.transform = 'translate(0px, 0px) scale(1)';
        devil.innerText = '👿';
        setTimeout(() => { devil.style.transition = 'transform 0.1s'; }, 500);
      }
    }

    // --- 천사 쓰다듬기 로직 (행운 청산) ---
    let lastAngelRubTime = 0;
    
    angel.addEventListener('touchmove', handleAngelRub, {passive: false});
    angel.addEventListener('mousemove', (e) => {
      // 마우스를 누른 상태에서 움직일 때만 반응
      if(e.buttons === 1) handleAngelRub(e);
    });

    function handleAngelRub(e) {
      if (points <= 0) return;
      
      const now = Date.now();
      if (now - lastAngelRubTime < 50) return; // 이벤트 쓰로틀링
      lastAngelRubTime = now;

      initAudio();
      playHealSound();
      
      // 부드러운 진동
      if (Math.random() > 0.5) triggerVibration(10);
      
      angel.innerText = '🥰';
      angel.style.transform = 'scale(1.1)';
      setTimeout(() => {
        angel.innerText = '👼';
        angel.style.transform = 'scale(1)';
      }, 200);

      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      createParticles(clientX, clientY, '#f1c40f', 'happy', 3);
      
      // 해피 말풍선 승천 효과 강화
      happyBubbles.forEach(bubble => {
        bubble.glow += 5;
        bubble.y -= 15;
      });

      updateScore(-25); // 점수 차감
    }

    // --- 게임 루프 ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 파티클 업데이트 및 렌더링
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }

      // 해피 말풍선 애니메이션 (자동 상승 및 빛남)
      happyBubbles = happyBubbles.filter(bubble => {
        bubble.y -= 0.5; // 기본 상승 속도
        bubble.el.style.top = `${bubble.y}px`;
        bubble.el.style.boxShadow = `0 0 ${bubble.glow}px rgba(241, 196, 15, ${bubble.glow/100})`;
        
        if (bubble.y < -100) {
          bubble.el.remove();
          return false;
        }
        return true;
      });

      requestAnimationFrame(loop);
    }
    
    // 초기화 실행
    updateScore(0); // 텍스트 및 볼 크기 초기 세팅
    loop();

  </script>
</body>
</html>
