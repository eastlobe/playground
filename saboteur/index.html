<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SABOTEUR (사보타지)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: #0d0906;
      background-image: radial-gradient(circle at 50% 20%, #2b1a10 0%, #0a0604 90%);
      color: #dfd0ba;
      font-family: 'Noto Serif KR', serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
      overflow-x: hidden;
    }

    .mine-cabinet {
      width: 100%;
      max-width: 1140px;
      height: 98vh;
      height: 98dvh;
      background: #191009;
      border: 6px solid #4a301c;
      border-radius: 6px;
      box-shadow: 0 0 50px rgba(0,0,0,0.95), inset 0 0 60px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    header {
      height: 52px;
      background: #24160c;
      border-bottom: 3px solid #3c2414;
      display: flex;
      padding: 0 16px;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .game-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 900;
      color: #e5b352;
      text-shadow: 2px 2px 5px #000;
      letter-spacing: 2px;
    }
    .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }

    .btn {
      font-family: 'Noto Serif KR', serif;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 14px;
      border: 2px solid #5a3c22;
      border-radius: 4px;
      background: linear-gradient(to bottom, #50371f, #332011);
      color: #f1e4cb;
      cursor: pointer;
      box-shadow: 0 3px 0 #180d06, 0 4px 6px rgba(0,0,0,0.6);
      transition: all 0.1s;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #180d06; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
    .btn-gold {
      background: linear-gradient(to bottom, #d4a338, #876214);
      border-color: #ffd978;
      color: #261703;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    }
    .btn-danger {
      background: linear-gradient(to bottom, #87241e, #4f120e);
      border-color: #ad3d35;
      color: #fae0de;
    }

    .view-section {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .view-section.active { display: flex; }

    /* 로비 */
    #view-lobby {
      padding: 20px;
      overflow-y: auto;
      gap: 16px;
    }
    .parchment-panel {
      background: #ebd8b5;
      color: #2b180d;
      border: 3px solid #6b472a;
      border-radius: 4px;
      padding: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.7);
    }
    .parchment-panel h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #4a2d18;
      margin-bottom: 12px;
      border-bottom: 2px solid #8e6843;
      padding-bottom: 4px;
    }
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="text"] {
      background: #fbf4e6;
      border: 2px solid #7d5736;
      color: #2a180b;
      padding: 10px 14px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      outline: none;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .room-card {
      background: #dfcaa2;
      border: 2px solid #7a5231;
      border-radius: 4px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 게임 룸 */
    .room-subbar {
      height: 44px;
      background: #180f07;
      border-bottom: 2px solid #331f11;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .round-badge {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      background: #3a2210;
      border: 1px solid #7a4f29;
      color: #ffd978;
      padding: 2px 8px;
      border-radius: 3px;
    }
    .role-secret {
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .role-miner { background: #16361c; color: #83e895; border: 1px solid #2f693b; }
    .role-saboteur { background: #4a1512; color: #ff8b82; border: 1px solid #822b25; }

    #waiting-panel {
      background: #24160c;
      border-bottom: 2px solid #3d2413;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .player-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .p-chip {
      background: #130a05;
      border: 1px solid #4a2e19;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
    }
    .p-chip.ready { border-color: #48a159; color: #83e895; }

    /* 보드 뷰포트 */
    .board-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0804;
      overflow: auto;
      padding: 16px;
      position: relative;
    }
    .mine-grid {
      display: grid;
      grid-template-columns: repeat(9, clamp(44px, 5.8vw, 68px));
      grid-template-rows: repeat(5, clamp(44px, 5.8vw, 68px));
      gap: 3px;
      background: #180f08;
      padding: 8px;
      border: 5px solid #442a17;
      border-radius: 4px;
      box-shadow: inset 0 0 25px #000;
    }
    .grid-cell {
      background: #110904;
      border: 1px solid #28170c;
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
    }
    .grid-cell.highlight-valid {
      outline: 3px dashed #ffd978 !important;
      background: rgba(255, 217, 120, 0.35) !important;
      cursor: pointer !important;
      animation: validGlow 0.8s infinite alternate;
    }
    @keyframes validGlow {
      from { background: rgba(255, 217, 120, 0.2); }
      to { background: rgba(255, 217, 120, 0.5); }
    }
    .grid-cell.tentative-tile {
      outline: 3px solid #ffd978;
      filter: brightness(1.3);
    }
    .grid-cell.highlight-rockfall {
      outline: 2px dashed #da3633;
      background: rgba(218, 54, 51, 0.35);
    }
    .grid-cell.highlight-map {
      outline: 2px dashed #388bfd;
      background: rgba(56, 139, 253, 0.35);
    }

    /* 하단 손패 콘솔 */
    .bottom-console {
      height: 154px;
      background: #1a0f07;
      border-top: 3px solid #422815;
      display: flex;
      padding: 8px 14px;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
      position: relative;
    }
    .hand-tray {
      flex: 1;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      height: 100%;
      align-items: center;
      padding: 4px 0;
    }
    .card {
      width: 80px;
      height: 120px;
      background: #ead7b3;
      color: #2a170b;
      border: 3px solid #78512e;
      border-radius: 5px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.7);
      transition: transform 0.15s, border-color 0.15s;
      position: relative;
    }
    .card:hover { transform: translateY(-4px); border-color: #ffd978; }
    .card.selected {
      border-color: #ffd978;
      transform: translateY(-8px);
      box-shadow: 0 0 16px rgba(255, 217, 120, 0.85);
    }
    .card.disabled { opacity: 0.35; pointer-events: none; }
    .card-graphic {
      width: 58px;
      height: 58px;
      background: #150c06;
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    .card-label {
      font-size: 0.68rem;
      font-weight: 800;
      color: #2b180a;
      text-align: center;
      line-height: 1.15;
      pointer-events: none;
    }

    .turn-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 150px;
    }

    /* 사이드바 */
    .sidebar {
      width: 250px;
      background: #140c06;
      border-left: 3px solid #3c2414;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
      flex-shrink: 0;
    }
    .p-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 230px;
      overflow-y: auto;
    }
    .p-row {
      background: #201308;
      border: 1.5px solid #3d2311;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 0.78rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .p-row.active-turn {
      border-color: #ffd978;
      background: #331d0a;
    }
    .tools-status {
      display: flex;
      gap: 4px;
      font-size: 0.72rem;
    }
    .tool-icon.broken {
      filter: grayscale(1);
      opacity: 0.4;
      text-decoration: line-through;
    }

    /* 모달 */
    .modal-backdrop {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 6, 3, 0.94);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 600;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 440px;
      background: #ebd8b5;
      color: #2a1608;
      border: 4px solid #6b4526;
      border-radius: 4px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 0 30px #000;
    }
    .modal-box h3, .modal-box h2 {
      font-family: 'Cinzel', serif;
      color: #4a2b15;
    }

    @media (max-width: 860px) {
      .mine-cabinet { height: 100vh; height: 100dvh; border: none; }
      .sidebar { display: none; }
      .bottom-console { height: 135px; padding: 4px 8px; }
      .card { width: 66px; height: 105px; }
      .card-graphic { width: 44px; height: 44px; }
      .turn-controls { min-width: 120px; }
      .btn { font-size: 0.65rem; padding: 6px 8px; }
    }
  </style>
</head>
<body>

  <div class="mine-cabinet">
    <header>
      <div class="game-logo">SABOTEUR</div>
      <div class="header-info">
        <span id="user-display-name">광부</span>
        <button id="btn-change-nickname" class="btn" style="padding:4px 8px; font-size:0.7rem;">이름 변경</button>
      </div>
    </header>

    <!-- [1. 로비] -->
    <div id="view-lobby" class="view-section active">
      <div class="parchment-panel">
        <h3>광산 탐사 원정대 모집</h3>
        <div class="input-row">
          <input type="text" id="create-room-title" placeholder="갱도 방 이름 (예: 황금 노다지)" style="flex:2; min-width:200px;">
          <button id="btn-create-room" class="btn btn-gold" style="flex:1;">방 개설</button>
        </div>
        <p style="font-size:0.75rem; color:#6b4728; margin-top:8px;">* 3~10인 플레이 지원. 원작 공식 룰에 따라 역할과 도구가 자동 조율됩니다.</p>
      </div>

      <div class="parchment-panel" style="flex:1; display:flex; flex-direction:column;">
        <h3>열려있는 갱도 목록</h3>
        <div id="room-list" class="room-grid"></div>
      </div>
    </div>

    <!-- [2. 게임 방] -->
    <div id="view-room" class="view-section">
      <div class="room-subbar">
        <div style="display:flex; align-items:center; gap:8px;">
          <strong id="room-title-label">방 제목</strong>
          <span id="round-indicator" class="round-badge">ROUND 1/3</span>
          <span id="role-badge" class="role-secret" style="display:none;">내 역할</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span id="turn-badge" style="color:#ffd978; font-weight:bold;">대기중</span>
          <span>덱: <strong id="deck-remain-text" style="color:#ffd978;">-</strong></span>
          <button id="btn-leave-room" class="btn btn-danger" style="padding:4px 8px; font-size:0.65rem;">나가기 🚪</button>
        </div>
      </div>

      <!-- 대기실 패널 -->
      <div id="waiting-panel">
        <div class="player-chips" id="waiting-player-chips"></div>
        <div style="display:flex; gap:8px;">
          <button id="btn-ready-toggle" class="btn btn-gold">준비 완료</button>
          <button id="btn-host-start" class="btn btn-gold" style="display:none;">탐사 시작! (3~10인)</button>
        </div>
      </div>

      <!-- 메인 보드 & 사이드바 -->
      <div style="flex:1; display:flex; overflow:hidden; position:relative;">
        <div class="board-viewport">
          <div id="mineGrid" class="mine-grid"></div>
        </div>

        <div class="sidebar">
          <div style="font-size:0.85rem; color:#e5b352; font-weight:700; border-bottom:1px solid #3c2414; padding-bottom:4px;">참가자 도구 & 금괴</div>
          <div id="p-list" class="p-list"></div>
          <div id="gameLogBox" style="flex:1; background:#0c0704; border:1px solid #2d190c; border-radius:4px; padding:6px; font-size:0.72rem; color:#a28c70; overflow-y:auto;">
            [안내] 방에 입장했습니다.
          </div>
        </div>
      </div>

      <!-- 하단 손패 트레이 & 조작 -->
      <div class="bottom-console">
        <div id="handTray" class="hand-tray"></div>
        <div class="turn-controls">
          <button id="btnPlaySelectedCard" class="btn btn-gold" style="display:none;">길/도구 사용</button>
          <button id="btnRotateCard" class="btn" style="display:none;">회전 🔄</button>
          <button id="btnDiscardCard" class="btn btn-danger" style="display:none;">버리기 🗑️</button>
          <button id="btnConfirmTurn" class="btn btn-gold" style="display:none;">턴 확정 ➔</button>
          <button id="btnUndoAction" class="btn btn-danger" style="display:none;">취소 ↩️</button>
        </div>
      </div>
    </div>

    <!-- 도구 파괴/수리 대상 모달 -->
    <div id="targetPlayerModal" class="modal-backdrop">
      <div class="modal-box">
        <h3 id="targetModalTitle">도구 사용 대상 선택</h3>
        <p id="targetModalDesc" style="font-size:0.8rem; color:#6b4728;"></p>
        <div id="targetPlayersList" style="display:flex; flex-direction:column; gap:8px; margin:8px 0;"></div>
        <button id="btnCloseTargetModal" class="btn">닫기</button>
      </div>
    </div>

    <!-- 라운드/최종 결과 모달 -->
    <div id="roundResultModal" class="modal-backdrop">
      <div class="modal-box">
        <h2 id="resultTitle"></h2>
        <div id="resultNuggetNotice" style="font-size:0.85rem; line-height:1.5;"></div>
        <div id="resultScoresTable" style="margin:8px 0; font-size:0.82rem; background:#dfcca4; padding:8px; border-radius:4px; border:1px solid #8e6843;"></div>
        <button id="btnNextRoundOrLobby" class="btn btn-gold" style="display:none;"></button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getDatabase, ref, set, update, onValue, get, remove, onDisconnect 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsvhq6Y1KzvUJ9gUlF6_QEgYoj-FzuZMU",
      authDomain: "relaynovelphobia.firebaseapp.com",
      databaseURL: "https://relaynovelphobia-default-rtdb.firebaseio.com",
      projectId: "relaynovelphobia",
      appId: "1:365170091282:web:6956889d54eea4070bbfcb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 사운드
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playTone(freq, dur = 0.08, type = "triangle", endFreq = null) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + dur);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }
    const SFX = {
      pick: () => playTone(380, 0.07, "triangle", 180),
      action: () => playTone(580, 0.1, "sine", 820),
      gold: () => [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.12, "triangle"), i * 80)),
      rock: () => playTone(120, 0.25, "sawtooth", 50)
    };

    // 타일 정의
    const PATH_TYPES = {
      cross: { t: true, r: true, b: true, l: true, dead: false },
      t_down: { t: false, r: true, b: true, l: true, dead: false },
      t_up: { t: true, r: true, b: false, l: true, dead: false },
      straight_h: { t: false, r: true, b: false, l: true, dead: false },
      straight_v: { t: true, r: false, b: true, l: false, dead: false },
      curve_rb: { t: false, r: true, b: true, l: false, dead: false },
      curve_lb: { t: false, r: false, b: true, l: true, dead: false },
      curve_rt: { t: true, r: true, b: false, l: false, dead: false },
      curve_lt: { t: true, r: false, b: false, l: true, dead: false },
      dead_cross: { t: true, r: true, b: true, l: true, dead: true },
      dead_h: { t: false, r: true, b: false, l: true, dead: true },
      dead_v: { t: true, r: false, b: true, l: false, dead: true },
      dead_t_down: { t: false, r: true, b: true, l: true, dead: true },
      dead_curve_rb: { t: false, r: true, b: true, l: false, dead: true }
    };

    function createInitialGrid() {
      const g = {};
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 9; c++) g[`${r}_${c}`] = null;
      }
      g["2_0"] = { type: "cross", ...PATH_TYPES.cross, fixed: true };
      const goals = ["GOLD", "COAL", "COAL"].sort(() => 0.5 - Math.random());
      g["0_8"] = { type: "goal", hidden: true, realType: goals[0] };
      g["2_8"] = { type: "goal", hidden: true, realType: goals[1] };
      g["4_8"] = { type: "goal", hidden: true, realType: goals[2] };
      return g;
    }

    function createOfficialDeck() {
      const deck = [];
      const openKeys = ["cross", "t_down", "t_up", "straight_h", "straight_v", "curve_rb", "curve_lb", "curve_rt", "curve_lt"];
      const deadKeys = ["dead_cross", "dead_h", "dead_v", "dead_t_down", "dead_curve_rb"];

      for (let i = 0; i < 35; i++) {
        const k = openKeys[i % openKeys.length];
        deck.push({ kind: "path", pathKey: k, ...PATH_TYPES[k], name: "통로 타일" });
      }
      for (let i = 0; i < 9; i++) {
        const k = deadKeys[i % deadKeys.length];
        deck.push({ kind: "path", pathKey: k, ...PATH_TYPES[k], name: "막힌 통로" });
      }

      for (let i = 0; i < 6; i++) deck.push({ kind: "action", actionType: "map", name: "비밀 지도 🗺️" });
      for (let i = 0; i < 3; i++) deck.push({ kind: "action", actionType: "rockfall", name: "낙석 🪨" });

      for (let i = 0; i < 3; i++) deck.push({ kind: "action", actionType: "break_pick", targetTool: "pickaxe", name: "곡괭이 파괴 ⛏️❌" });
      for (let i = 0; i < 3; i++) deck.push({ kind: "action", actionType: "break_lamp", targetTool: "lamp", name: "랜턴 파괴 💡❌" });
      for (let i = 0; i < 3; i++) deck.push({ kind: "action", actionType: "break_cart", targetTool: "cart", name: "수레 파괴 🛒❌" });

      for (let i = 0; i < 2; i++) deck.push({ kind: "action", actionType: "fix_single", fixTools: ["pickaxe"], name: "곡괭이 수리 ⛏️✨" });
      for (let i = 0; i < 2; i++) deck.push({ kind: "action", actionType: "fix_single", fixTools: ["lamp"], name: "랜턴 수리 💡✨" });
      for (let i = 0; i < 2; i++) deck.push({ kind: "action", actionType: "fix_single", fixTools: ["cart"], name: "수레 수리 🛒✨" });

      deck.push({ kind: "action", actionType: "fix_dual", fixTools: ["pickaxe", "lamp"], name: "곡괭이/랜턴 수리 ⛏️💡" });
      deck.push({ kind: "action", actionType: "fix_dual", fixTools: ["pickaxe", "cart"], name: "곡괭이/수레 수리 ⛏️🛒" });
      deck.push({ kind: "action", actionType: "fix_dual", fixTools: ["lamp", "cart"], name: "랜턴/수레 수리 💡🛒" });

      return deck.sort(() => 0.5 - Math.random());
    }

    function createOfficialRolesPool(playerCount) {
      let miners = 3, sabos = 1;
      if (playerCount === 4) { miners = 4; sabos = 1; }
      else if (playerCount === 5) { miners = 4; sabos = 2; }
      else if (playerCount === 6) { miners = 5; sabos = 2; }
      else if (playerCount === 7) { miners = 5; sabos = 3; }
      else if (playerCount === 8) { miners = 6; sabos = 3; }
      else if (playerCount === 9) { miners = 7; sabos = 3; }
      else if (playerCount >= 10) { miners = 7; sabos = 4; }

      const pool = [];
      for (let i = 0; i < miners; i++) pool.push("MINER");
      for (let i = 0; i < sabos; i++) pool.push("SABOTEUR");

      return pool.sort(() => 0.5 - Math.random()).slice(0, playerCount);
    }

    function createNuggetDeck() {
      const nuggets = [];
      for (let i = 0; i < 16; i++) nuggets.push(1);
      for (let i = 0; i < 8; i++) nuggets.push(2);
      for (let i = 0; i < 4; i++) nuggets.push(3);
      return nuggets.sort(() => 0.5 - Math.random());
    }

    // 유저 및 세션
    let myUid = localStorage.getItem("saboteur_uid") || ("u_" + Math.random().toString(36).substr(2, 7));
    let myName = localStorage.getItem("saboteur_nickname") || ("광부_" + myUid.substr(2, 4));
    let mySession = Date.now() + "_" + Math.random().toString(36).substr(2, 6);

    localStorage.setItem("saboteur_uid", myUid);
    localStorage.setItem("saboteur_nickname", myName);
    sessionStorage.setItem("saboteur_session", mySession);

    const userDisplayName = document.getElementById("user-display-name");
    userDisplayName.textContent = myName;

    set(ref(db, `saboteur_sessions/${myUid}`), mySession);
    onValue(ref(db, `saboteur_sessions/${myUid}`), snap => {
      if (snap.val() && snap.val() !== mySession) {
        alert("다른 창에서 접속하여 현재 연결이 종료됩니다.");
        leaveRoom();
        location.reload();
      }
    });

    document.getElementById("btn-change-nickname").addEventListener("click", () => {
      const inp = prompt("새 닉네임 입력:", myName);
      if (inp && inp.trim()) {
        myName = inp.trim();
        localStorage.setItem("saboteur_nickname", myName);
        userDisplayName.textContent = myName;
        if (currentRoomId) {
          update(ref(db, `saboteur_rooms/${currentRoomId}/players/${myUid}`), { name: myName });
        }
      }
    });

    // 상태 관리
    let currentRoomId = null;
    let roomData = null;
    let selectedCardIdx = null;
    let selectedCardRotation = 0;
    let tentativeAction = null;
    let isPlacementMode = false;

    function switchView(viewName) {
      document.getElementById("view-lobby").classList.toggle("active", viewName === "lobby");
      document.getElementById("view-room").classList.toggle("active", viewName === "room");
    }

    onValue(ref(db, "saboteur_rooms"), snap => {
      const rooms = snap.val();
      const listEl = document.getElementById("room-list");
      listEl.innerHTML = "";

      if (!rooms) {
        listEl.innerHTML = `<p style="color:#6b4728; font-size:0.85rem; padding:10px;">개설된 갱도가 없습니다. 첫 번째 방을 개설해보세요!</p>`;
        return;
      }

      Object.entries(rooms).forEach(([rId, r]) => {
        const pCount = Object.keys(r.players || {}).length;
        if (pCount === 0) {
          remove(ref(db, `saboteur_rooms/${rId}`));
          return;
        }

        const isPlaying = (r.status === "PLAYING");
        const card = document.createElement("div");
        card.className = "room-card";
        card.innerHTML = `
          <div>
            <strong style="color:#2a180b; font-size:0.95rem;">${escapeHtml(r.title)}</strong>
            <div style="font-size:0.78rem; color:#6b4728; margin-top:3px;">
              인원: ${pCount}/10명 · ${isPlaying ? '탐사중' : '대기중'}
            </div>
          </div>
          <button class="btn btn-gold" ${isPlaying ? 'disabled' : ''}>
            ${isPlaying ? '진행중' : '입장'}
          </button>
        `;
        if (!isPlaying) {
          card.querySelector("button").addEventListener("click", () => joinRoom(rId));
        }
        listEl.appendChild(card);
      });
    });

    document.getElementById("btn-create-room").addEventListener("click", async () => {
      const titleInput = document.getElementById("create-room-title");
      const title = titleInput.value.trim() || `${myName}의 갱도`;

      const newRef = ref(db, `saboteur_rooms/${Date.now().toString(36)}`);
      const rId = newRef.key;

      await set(newRef, {
        id: rId,
        title: title,
        status: "WAITING",
        currentRound: 1,
        maxRounds: 3,
        hostUid: myUid,
        players: {
          [myUid]: { id: myUid, name: myName, isReady: true, score: 0 }
        },
        scores: { [myUid]: 0 },
        tools: {
          [myUid]: { pickaxe: true, lamp: true, cart: true }
        },
        nuggetDeck: createNuggetDeck()
      });

      titleInput.value = "";
      joinRoom(rId);
    });

    async function joinRoom(rId) {
      currentRoomId = rId;
      const rRef = ref(db, `saboteur_rooms/${rId}`);
      const snap = await get(rRef);
      if (!snap.exists()) return alert("존재하지 않는 방입니다.");

      const r = snap.val();
      if (r.status !== "WAITING" && !r.players?.[myUid]) return alert("이미 탐사가 진행 중인 방입니다.");

      const pRef = ref(db, `saboteur_rooms/${rId}/players/${myUid}`);
      await update(pRef, {
        id: myUid,
        name: myName,
        isReady: (r.hostUid === myUid),
        score: r.scores?.[myUid] || 0
      });

      await update(ref(db, `saboteur_rooms/${rId}/tools/${myUid}`), {
        pickaxe: true, lamp: true, cart: true
      });

      onDisconnect(pRef).remove();
      switchView("room");
      listenRoom(rId);
    }

    function leaveRoom() {
      if (currentRoomId) {
        remove(ref(db, `saboteur_rooms/${currentRoomId}/players/${myUid}`)).then(() => {
          get(ref(db, `saboteur_rooms/${currentRoomId}/players`)).then(s => {
            const pls = s.val() || {};
            const ids = Object.keys(pls);
            if (ids.length === 0) remove(ref(db, `saboteur_rooms/${currentRoomId}`));
            else if (roomData && roomData.hostUid === myUid) {
              update(ref(db, `saboteur_rooms/${currentRoomId}`), { hostUid: ids[0] });
            }
          });
        });
      }
      currentRoomId = null;
      roomData = null;
      selectedCardIdx = null;
      tentativeAction = null;
      isPlacementMode = false;
      document.getElementById("roundResultModal").style.display = "none";
      switchView("lobby");
    }

    document.getElementById("btn-leave-room").addEventListener("click", () => {
      if (confirm("정말 갱도에서 나가시겠습니까?")) leaveRoom();
    });

    function listenRoom(rId) {
      onValue(ref(db, `saboteur_rooms/${rId}`), snap => {
        roomData = snap.val();
        if (!roomData) {
          alert("방이 종료되었거나 폭파되었습니다.");
          leaveRoom();
          return;
        }
        renderRoom();
      });
    }

    function renderRoom() {
      const players = roomData.players || {};
      const pIds = Object.keys(players);
      const isHost = (roomData.hostUid === myUid);

      document.getElementById("room-title-label").textContent = roomData.title;
      document.getElementById("round-indicator").textContent = `ROUND ${roomData.currentRound || 1}/3`;

      // 대기실
      if (roomData.status === "WAITING") {
        document.getElementById("waiting-panel").style.display = "flex";
        document.getElementById("role-badge").style.display = "none";
        document.getElementById("turn-badge").textContent = "대기중";
        document.getElementById("deck-remain-text").textContent = "-";
        document.getElementById("roundResultModal").style.display = "none";

        const chipsEl = document.getElementById("waiting-player-chips");
        chipsEl.innerHTML = "";

        let allReady = true;
        pIds.forEach(id => {
          const p = players[id];
          const isPhead = (id === roomData.hostUid);
          const c = document.createElement("div");
          c.className = `p-chip ${p.isReady ? 'ready' : ''}`;
          c.innerHTML = `${isPhead ? '👑' : ''} ${escapeHtml(p.name)} [${p.isReady ? '준비완료' : '대기'}]`;
          chipsEl.appendChild(c);
          if (!isPhead && !p.isReady) allReady = false;
        });

        const btnReady = document.getElementById("btn-ready-toggle");
        const btnStart = document.getElementById("btn-host-start");

        if (isHost) {
          btnReady.style.display = "none";
          btnStart.style.display = "inline-block";
          btnStart.disabled = (pIds.length < 3 || !allReady);
          btnStart.textContent = `탐사 시작! (${pIds.length}/3~10인)`;
        } else {
          btnStart.style.display = "none";
          btnReady.style.display = "inline-block";
          const myR = players[myUid]?.isReady || false;
          btnReady.textContent = myR ? "준비 취소" : "준비 완료";
          btnReady.className = `btn ${myR ? 'btn-danger' : 'btn-gold'}`;
        }

        renderEmptyBoard();
        return;
      }

      // 인게임 플레이 시작 시 모달 강제 종료
      if (roomData.status === "PLAYING") {
        document.getElementById("roundResultModal").style.display = "none";
      }

      document.getElementById("waiting-panel").style.display = "none";

      renderPlayerSidebar();
      renderHandTray();
      renderGameBoard();

      if (roomData.status === "FINISHED") {
        showRoundOrFinalResult();
      }
    }

    function renderEmptyBoard() {
      const gEl = document.getElementById("mineGrid");
      gEl.innerHTML = "";
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement("div");
          cell.className = "grid-cell";
          if (r === 2 && c === 0) cell.innerHTML = renderTileSVG({ type: "cross", ...PATH_TYPES.cross, fixed: true });
          if ((r === 0 || r === 2 || r === 4) && c === 8) cell.innerHTML = renderTileSVG({ type: "goal", hidden: true });
          gEl.appendChild(cell);
        }
      }
      document.getElementById("handTray").innerHTML = `<span style="font-size:0.75rem; color:#a28c70; margin:auto;">탐사가 시작되면 손패가 지급됩니다.</span>`;
    }

    document.getElementById("btn-host-start").addEventListener("click", () => {
      startRound(roomData.currentRound || 1);
    });

    document.getElementById("btn-ready-toggle").addEventListener("click", () => {
      const cur = roomData.players[myUid]?.isReady || false;
      update(ref(db, `saboteur_rooms/${currentRoomId}/players/${myUid}`), { isReady: !cur });
    });

    async function startRound(roundNum) {
      const order = Object.keys(roomData.players || {});
      const pCount = order.length;
      if (pCount < 3) return alert("사보타지는 최소 3명 이상이어야 시작할 수 있습니다.");

      let handSize = 6;
      if (pCount >= 8) handSize = 4;
      else if (pCount >= 6) handSize = 5;

      const rolePool = createOfficialRolesPool(pCount);
      const roles = {};
      const tools = {};
      order.forEach((uid, idx) => {
        roles[uid] = rolePool[idx];
        tools[uid] = { pickaxe: true, lamp: true, cart: true };
      });

      const fullDeck = createOfficialDeck();
      const hands = {};
      order.forEach(uid => {
        hands[uid] = fullDeck.splice(0, handSize);
      });

      selectedCardIdx = null;
      selectedCardRotation = 0;
      tentativeAction = null;
      isPlacementMode = false;

      const updates = {
        status: "PLAYING",
        currentRound: roundNum,
        grid: createInitialGrid(),
        deck: fullDeck,
        hands: hands,
        roles: roles,
        playerOrder: order,
        turnIdx: 0,
        tools: tools,
        winner: null,
        goldDistributor: null,
        roundScored: false
      };

      await update(ref(db, `saboteur_rooms/${currentRoomId}`), updates);
    }

    // 타일 SVG
    function renderTileSVG(t) {
      if (!t) return "";
      if (t.type === "goal") {
        if (t.hidden) {
          return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;"><rect width="100" height="100" fill="#201309" rx="4"/><text x="50" y="62" fill="#ffd978" font-size="34" font-weight="bold" text-anchor="middle">?</text></svg>`;
        }
        if (t.realType === "GOLD") {
          return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;"><rect width="100" height="100" fill="#755214" rx="4"/><circle cx="50" cy="50" r="28" fill="#ffd700"/><text x="50" y="58" fill="#2a1b04" font-size="20" font-weight="bold" text-anchor="middle">GOLD</text></svg>`;
        }
        return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;"><rect width="100" height="100" fill="#221b16" rx="4"/><circle cx="50" cy="50" r="26" fill="#120c08"/><text x="50" y="57" fill="#887262" font-size="18" font-weight="bold" text-anchor="middle">돌</text></svg>`;
      }

      const pathColor = t.dead ? "#943027" : "#d19a3b";
      let p = `<rect width="100" height="100" fill="#1b1108" rx="4"/>`;
      p += `<circle cx="50" cy="50" r="14" fill="${pathColor}"/>`;
      if (t.t) p += `<rect x="36" y="0" width="28" height="50" fill="${pathColor}"/>`;
      if (t.b) p += `<rect x="36" y="50" width="28" height="50" fill="${pathColor}"/>`;
      if (t.l) p += `<rect x="0" y="36" width="50" height="28" fill="${pathColor}"/>`;
      if (t.r) p += `<rect x="50" y="36" width="50" height="28" fill="${pathColor}"/>`;

      if (t.dead) {
        p += `<line x1="30" y1="30" x2="70" y2="70" stroke="#ff5c52" stroke-width="6"/>
              <line x1="70" y1="30" x2="30" y2="70" stroke="#ff5c52" stroke-width="6"/>`;
      }
      if (t.fixed) {
        p += `<text x="50" y="56" fill="#f1e4cb" font-size="14" font-weight="bold" text-anchor="middle">출발</text>`;
      }
      return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;pointer-events:none;">${p}</svg>`;
    }

    function getRotatedTile(tile, rot) {
      if (!tile || rot === 0) return { ...tile };
      return { ...tile, t: tile.b, b: tile.t, l: tile.r, r: tile.l };
    }

    // BFS 알고리즘: 출발점 (2, 0)으로부터 끊김 없이 통로가 이어졌는지 검사
    function isConnectedToStartByPath(virtualGrid, targetR, targetC) {
      targetR = parseInt(targetR, 10);
      targetC = parseInt(targetC, 10);

      const queue = [{ r: 2, c: 0 }];
      const visited = new Set(["2_0"]);

      const dirs = [
        { dr: -1, dc: 0, me: 't', opp: 'b' },
        { dr: 1, dc: 0, me: 'b', opp: 't' },
        { dr: 0, dc: -1, me: 'l', opp: 'r' },
        { dr: 0, dc: 1, me: 'r', opp: 'l' }
      ];

      while (queue.length > 0) {
        const cur = queue.shift();
        if (cur.r === targetR && cur.c === targetC) return true;

        const curTile = virtualGrid[`${cur.r}_${cur.c}`];
        if (!curTile) continue;

        for (const d of dirs) {
          const nr = cur.r + d.dr;
          const nc = cur.c + d.dc;
          const key = `${nr}_${nc}`;

          if (nr < 0 || nr >= 5 || nc < 0 || nc >= 9) continue;
          if (visited.has(key)) continue;

          const nextTile = virtualGrid[key];
          if (!nextTile) continue;
          if (nextTile.type === "goal") continue;

          // 맞닿은 면의 통로가 둘 다 열려 있으면 탐색 큐에 추가
          if (curTile[d.me] && nextTile[d.opp]) {
            visited.add(key);
            queue.push({ r: nr, c: nc });
          }
        }
      }

      return false;
    }

    // 길 타일 유효성 검사 (4방향 통로 일치 + 출발점 연결)
    function canPlaceTile(grid, r, c, tile) {
      r = parseInt(r, 10);
      c = parseInt(c, 10);

      if (grid && grid[`${r}_${c}`]) return false;

      let hasNeighbor = false;
      let conflict = false;

      const dirs = [
        { dr: -1, dc: 0, me: 't', opp: 'b' },
        { dr: 1, dc: 0, me: 'b', opp: 't' },
        { dr: 0, dc: -1, me: 'l', opp: 'r' },
        { dr: 0, dc: 1, me: 'r', opp: 'l' }
      ];

      for (const d of dirs) {
        const nr = r + d.dr;
        const nc = c + d.dc;
        if (nr < 0 || nr >= 5 || nc < 0 || nc >= 9) continue;
        const nb = grid ? grid[`${nr}_${nc}`] : null;
        if (!nb) continue;

        if (nb.type === "goal") {
          if (tile[d.me]) hasNeighbor = true;
        } else {
          const myOpen = Boolean(tile[d.me]);
          const nbOpen = Boolean(nb[d.opp]);

          if (myOpen !== nbOpen) {
            conflict = true;
            break;
          }
          if (myOpen && nbOpen) {
            hasNeighbor = true;
          }
        }
      }

      if (conflict || !hasNeighbor) return false;

      // 가상 보드판에 올려두고 출발점과 이어지는지 검증
      const virtualGrid = { ...grid, [`${r}_${c}`]: tile };
      return isConnectedToStartByPath(virtualGrid, r, c);
    }

    // 턴 판정
    function checkIsMyTurn() {
      if (!roomData || !roomData.playerOrder) return false;
      const order = Array.isArray(roomData.playerOrder) 
        ? roomData.playerOrder 
        : Object.values(roomData.playerOrder);
      const curIdx = Number(roomData.turnIdx || 0);
      return (String(order[curIdx]).trim() === String(myUid).trim());
    }

    // 보드 렌더링
    const mineGridEl = document.getElementById("mineGrid");
    const handTrayEl = document.getElementById("handTray");
    const pListEl = document.getElementById("p-list");

    function renderGameBoard() {
      if (!roomData || !roomData.grid) return;
      const baseGrid = roomData.grid;
      mineGridEl.innerHTML = "";

      const displayGrid = { ...baseGrid };
      if (tentativeAction && tentativeAction.type === "PLACE") {
        displayGrid[`${tentativeAction.r}_${tentativeAction.c}`] = tentativeAction.tile;
      }

      const isMyTurn = checkIsMyTurn();
      const myTools = roomData.tools?.[myUid] || { pickaxe: true, lamp: true, cart: true };
      const isAnyToolBroken = (!myTools.pickaxe || !myTools.lamp || !myTools.cart);

      const myCard = (selectedCardIdx !== null) ? roomData.hands?.[myUid]?.[selectedCardIdx] : null;
      const hasTentative = Boolean(tentativeAction);

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 9; c++) {
          const cellKey = `${r}_${c}`;
          const tile = displayGrid[cellKey];
          const cell = document.createElement("div");
          cell.className = "grid-cell";

          if (tile) {
            cell.innerHTML = renderTileSVG(tile);
            if (tentativeAction && tentativeAction.type === "PLACE" && tentativeAction.r === r && tentativeAction.c === c) {
              cell.classList.add("tentative-tile");
            }

            if (!hasTentative && isMyTurn && myCard?.actionType === "rockfall" && isPlacementMode && !tile.fixed && tile.type !== "goal") {
              cell.classList.add("highlight-rockfall");
              cell.onclick = () => setupRockfall(r, c);
            }
            if (!hasTentative && isMyTurn && myCard?.actionType === "map" && isPlacementMode && tile.type === "goal" && tile.hidden) {
              cell.classList.add("highlight-map");
              cell.onclick = () => setupMap(tile);
            }
          } else {
            // 길 타일 가이드 (선택된 카드가 있고 사용 모드일 때)
            if (!hasTentative && isMyTurn && myCard?.kind === "path" && isPlacementMode && !isAnyToolBroken) {
              const rotated = getRotatedTile(myCard, selectedCardRotation);
              if (canPlaceTile(displayGrid, r, c, rotated)) {
                cell.classList.add("highlight-valid");
                cell.onclick = () => setupPlacement(r, c, rotated);
              }
            }
          }

          mineGridEl.appendChild(cell);
        }
      }
    }

    // 손패 렌더링
    function renderHandTray() {
      if (!roomData || !roomData.hands) return;
      const hand = roomData.hands[myUid] || [];
      handTrayEl.innerHTML = "";

      const isMyTurn = checkIsMyTurn();
      const hasTentative = Boolean(tentativeAction);

      hand.forEach((card, idx) => {
        const isTentativeCard = (tentativeAction && tentativeAction.cardIdx === idx);
        const cardEl = document.createElement("div");
        cardEl.className = `card ${selectedCardIdx === idx ? 'selected' : ''} ${isTentativeCard ? 'disabled' : ''}`;

        let previewHTML = "";
        if (card.kind === "path") {
          const rot = (selectedCardIdx === idx) ? selectedCardRotation : 0;
          previewHTML = `<div class="card-graphic">${renderTileSVG(getRotatedTile(card, rot))}</div>`;
        } else {
          let icon = "🗺️";
          if (card.actionType === "rockfall") icon = "🪨";
          else if (card.actionType.startsWith("break")) icon = "🔨❌";
          else if (card.actionType.startsWith("fix")) icon = "🛠️✨";
          previewHTML = `<div class="card-graphic" style="font-size:1.6rem;">${icon}</div>`;
        }

        cardEl.innerHTML = `
          ${previewHTML}
          <div class="card-label">${card.name}</div>
        `;

        cardEl.onclick = (e) => {
          e.stopPropagation();

          if (!isMyTurn) {
            alert("지금은 상대방의 턴입니다!");
            return;
          }
          if (hasTentative) {
            alert("'턴 확정'을 누르거나 '취소'를 누르세요.");
            return;
          }

          if (selectedCardIdx === idx) {
            selectedCardIdx = null;
            isPlacementMode = false;
          } else {
            selectedCardIdx = idx;
            selectedCardRotation = 0;
            // 카드를 누르면 즉시 길 놓기/행동 모드로 진입
            isPlacementMode = true;

            // 도구 파괴/수리는 대상 모달 오픈
            if (card.actionType && (card.actionType.startsWith("break") || card.actionType.startsWith("fix"))) {
              openTargetModal(card);
            }
          }

          renderHandTray();
          renderGameBoard();
        };

        handTrayEl.appendChild(cardEl);
      });

      updateTurnButtons();
    }

    function updateTurnButtons() {
      const btnPlay = document.getElementById("btnPlaySelectedCard");
      const btnRotate = document.getElementById("btnRotateCard");
      const btnDiscard = document.getElementById("btnDiscardCard");
      const btnConfirm = document.getElementById("btnConfirmTurn");
      const btnUndo = document.getElementById("btnUndoAction");

      const hasTentative = Boolean(tentativeAction);
      const myCard = (selectedCardIdx !== null) ? roomData?.hands?.[myUid]?.[selectedCardIdx] : null;
      const isMyTurn = checkIsMyTurn();

      if (hasTentative) {
        btnConfirm.style.display = "block";
        btnUndo.style.display = "block";
        btnPlay.style.display = "none";
        btnRotate.style.display = "none";
        btnDiscard.style.display = "none";
      } else {
        btnConfirm.style.display = "none";
        btnUndo.style.display = "none";

        if (isMyTurn && myCard) {
          btnDiscard.style.display = "block";
          btnRotate.style.display = (myCard.kind === "path") ? "block" : "none";
        } else {
          btnDiscard.style.display = "none";
          btnRotate.style.display = "none";
          btnPlay.style.display = "none";
        }
      }
    }

    // 버리기 버튼
    document.getElementById("btnDiscardCard").onclick = () => {
      if (selectedCardIdx === null) return;
      tentativeAction = { type: "DISCARD", cardIdx: selectedCardIdx };
      selectedCardIdx = null;
      isPlacementMode = false;
      renderHandTray();
      renderGameBoard();
    };

    // 회전 버튼
    document.getElementById("btnRotateCard").onclick = () => {
      selectedCardRotation = (selectedCardRotation === 0) ? 180 : 0;
      renderHandTray();
      renderGameBoard();
    };

    // 취소 버튼
    document.getElementById("btnUndoAction").onclick = () => {
      tentativeAction = null;
      selectedCardIdx = null;
      selectedCardRotation = 0;
      isPlacementMode = false;
      renderHandTray();
      renderGameBoard();
    };

    // 턴 확정 버튼
    document.getElementById("btnConfirmTurn").onclick = async () => {
      if (!tentativeAction) return;
      const btn = document.getElementById("btnConfirmTurn");
      btn.disabled = true;

      const action = tentativeAction;
      const hand = [...(roomData.hands[myUid] || [])];
      hand.splice(action.cardIdx, 1);

      const deck = [...(roomData.deck || [])];
      if (deck.length > 0) {
        hand.push(deck.pop());
      }

      const order = Array.isArray(roomData.playerOrder) ? roomData.playerOrder : Object.values(roomData.playerOrder);
      const nextTurn = ((Number(roomData.turnIdx) || 0) + 1) % order.length;

      const updates = {
        ...action.extraUpdates,
        [`hands/${myUid}`]: hand,
        deck: deck,
        turnIdx: nextTurn
      };

      let allHandsEmpty = (hand.length === 0);
      order.forEach(id => {
        if (id !== myUid && (roomData.hands[id] || []).length > 0) allHandsEmpty = false;
      });
      if (deck.length === 0 && allHandsEmpty && !updates.status) {
        updates.status = "FINISHED";
        updates.winner = "SABOTEUR";
      }

      tentativeAction = null;
      selectedCardIdx = null;
      isPlacementMode = false;

      await update(ref(db, `saboteur_rooms/${currentRoomId}`), updates);
      btn.disabled = false;
    };

    function setupPlacement(r, c, tile) {
      SFX.pick();
      const updates = {};
      updates[`grid/${r}_${c}`] = tile;

      const virtualGrid = { ...roomData.grid, [`${r}_${c}`]: tile };

      const dirs = [
        { r: r-1, c: c, me: 't', opp: 'b' },
        { r: r+1, c: c, me: 'b', opp: 't' },
        { r: r, c: c-1, me: 'l', opp: 'r' },
        { r: r, c: c+1, me: 'r', opp: 'l' }
      ];

      for (const d of dirs) {
        if (d.r < 0 || d.r >= 5 || d.c < 0 || d.c >= 9) continue;
        const target = roomData.grid ? roomData.grid[`${d.r}_${d.c}`] : null;

        if (target && target.type === "goal" && target.hidden && tile[d.me]) {
          if (isConnectedToStartByPath(virtualGrid, r, c)) {
            updates[`grid/${d.r}_${d.c}/hidden`] = false;
            if (target.realType === "GOLD") {
              updates.status = "FINISHED";
              updates.winner = "MINERS";
              updates.goldDistributor = myUid;
              SFX.gold();
            }
          }
        }
      }

      tentativeAction = {
        type: "PLACE",
        cardIdx: selectedCardIdx,
        r: r, c: c, tile: tile,
        extraUpdates: updates
      };
      selectedCardIdx = null;
      isPlacementMode = false;
      renderHandTray();
      renderGameBoard();
    }

    function setupRockfall(r, c) {
      SFX.rock();
      tentativeAction = {
        type: "ACTION",
        cardIdx: selectedCardIdx,
        extraUpdates: { [`grid/${r}_${c}`]: null }
      };
      selectedCardIdx = null;
      isPlacementMode = false;
      renderHandTray();
      renderGameBoard();
    }

    function setupMap(tile) {
      alert(`🗺️ [비밀 지도 확인 결과]\n해당 목적지는 [${tile.realType === "GOLD" ? "⭐ 진짜 금광!" : "❌ 돌(꽝)"}] 입니다.`);
      tentativeAction = {
        type: "ACTION",
        cardIdx: selectedCardIdx,
        extraUpdates: {}
      };
      selectedCardIdx = null;
      isPlacementMode = false;
      renderHandTray();
      renderGameBoard();
    }

    function openTargetModal(card) {
      const modal = document.getElementById("targetPlayerModal");
      const listEl = document.getElementById("targetPlayersList");
      const titleEl = document.getElementById("targetModalTitle");
      const descEl = document.getElementById("targetModalDesc");
      listEl.innerHTML = "";

      const isBreak = card.actionType.startsWith("break");
      const toolNames = { pickaxe: "⛏️곡괭이", lamp: "💡랜턴", cart: "🛒수레" };

      if (isBreak) {
        titleEl.textContent = `도구 파괴: ${toolNames[card.targetTool]}`;
        descEl.textContent = "파괴할 상대 광부를 지목하세요. (도구가 고장나면 길을 놓을 수 없습니다)";
      } else {
        titleEl.textContent = `도구 수리: ${card.fixTools.map(t => toolNames[t]).join(" 또는 ")}`;
        descEl.textContent = "자신 또는 동료 광부의 고장난 도구를 수리하세요.";
      }

      const order = Array.isArray(roomData.playerOrder) ? roomData.playerOrder : Object.values(roomData.playerOrder);
      order.forEach(id => {
        const p = roomData.players[id];
        const pTools = roomData.tools?.[id] || { pickaxe: true, lamp: true, cart: true };

        if (isBreak) {
          if (!pTools[card.targetTool]) return;

          const btn = document.createElement("button");
          btn.className = "btn btn-danger";
          btn.textContent = `${p.name}의 ${toolNames[card.targetTool]} 파괴`;
          btn.onclick = () => {
            modal.style.display = "none";
            SFX.action();
            tentativeAction = {
              type: "ACTION",
              cardIdx: selectedCardIdx,
              extraUpdates: { [`tools/${id}/${card.targetTool}`]: false }
            };
            selectedCardIdx = null;
            isPlacementMode = false;
            renderHandTray();
            renderGameBoard();
          };
          listEl.appendChild(btn);
        } else {
          card.fixTools.forEach(tName => {
            if (pTools[tName] === false) {
              const btn = document.createElement("button");
              btn.className = "btn btn-gold";
              btn.textContent = `${p.name}의 ${toolNames[tName]} 수리 ${id === myUid ? '(나)' : ''}`;
              btn.onclick = () => {
                modal.style.display = "none";
                SFX.action();
                tentativeAction = {
                  type: "ACTION",
                  cardIdx: selectedCardIdx,
                  extraUpdates: { [`tools/${id}/${tName}`]: true }
                };
                selectedCardIdx = null;
                isPlacementMode = false;
                renderHandTray();
                renderGameBoard();
              };
              listEl.appendChild(btn);
            }
          });
        }
      });

      if (listEl.children.length === 0) {
        listEl.innerHTML = `<div style="font-size:0.85rem; color:#7a502f; padding:8px;">적용 가능한 대상이 없습니다.</div>`;
      }
      modal.style.display = "flex";
    }

    document.getElementById("btnCloseTargetModal").onclick = () => {
      document.getElementById("targetPlayerModal").style.display = "none";
      selectedCardIdx = null;
      isPlacementMode = false;
      renderHandTray();
      renderGameBoard();
    };

    function renderPlayerSidebar() {
      pListEl.innerHTML = "";
      const order = Array.isArray(roomData.playerOrder) ? roomData.playerOrder : Object.values(roomData.playerOrder);
      const curTurnId = order[Number(roomData.turnIdx) || 0];
      const isMyTurn = (curTurnId === myUid);

      document.getElementById("turn-badge").textContent = isMyTurn ? "👉 내 턴!" : "상대방 턴";
      document.getElementById("turn-badge").style.color = isMyTurn ? "#ffd978" : "#8e7865";

      order.forEach(id => {
        const p = roomData.players[id];
        if (!p) return;
        const row = document.createElement("div");
        row.className = `p-row ${id === curTurnId ? 'active-turn' : ''}`;
        const pTools = roomData.tools?.[id] || { pickaxe: true, lamp: true, cart: true };
        const score = roomData.scores?.[id] || 0;

        row.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span>${id === curTurnId ? '⛏️ ' : ''}${escapeHtml(p.name)} ${id === myUid ? '(나)' : ''}</span>
            <span style="color:#ffd978; font-weight:700;">🪙 ${score}개</span>
          </div>
          <div class="tools-status">
            <span class="tool-icon ${pTools.pickaxe ? '' : 'broken'}">⛏️곡괭이</span>
            <span class="tool-icon ${pTools.lamp ? '' : 'broken'}">💡랜턴</span>
            <span class="tool-icon ${pTools.cart ? '' : 'broken'}">🛒수레</span>
          </div>
        `;
        pListEl.appendChild(row);
      });

      const myRole = roomData.roles?.[myUid];
      const roleBadge = document.getElementById("role-badge");
      if (myRole) {
        roleBadge.style.display = "inline-block";
        roleBadge.textContent = (myRole === "SABOTEUR") ? "사보추어 💣" : "광부 ⛏️";
        roleBadge.className = `role-secret ${myRole === "SABOTEUR" ? 'role-saboteur' : 'role-miner'}`;
      }

      document.getElementById("deck-remain-text").textContent = `${(roomData.deck || []).length}장`;
    }

    // 3라운드 매치 결과
    async function showRoundOrFinalResult() {
      const modal = document.getElementById("roundResultModal");
      const titleEl = document.getElementById("resultTitle");
      const noticeEl = document.getElementById("resultNuggetNotice");
      const scoresTable = document.getElementById("resultScoresTable");
      const btnNext = document.getElementById("btnNextRoundOrLobby");

      const round = roomData.currentRound || 1;
      const winner = roomData.winner;
      const isHost = (roomData.hostUid === myUid);
      const scores = { ...(roomData.scores || {}) };

      if (isHost && !roomData.roundScored) {
        const order = Array.isArray(roomData.playerOrder) ? roomData.playerOrder : Object.values(roomData.playerOrder);
        const roles = roomData.roles || {};
        const nuggetDeck = [...(roomData.nuggetDeck || createNuggetDeck())];

        if (winner === "MINERS") {
          const distributorIdx = order.indexOf(roomData.goldDistributor);
          const minerOrder = [];
          for (let i = 0; i < order.length; i++) {
            const u = order[(distributorIdx - i + order.length) % order.length];
            if (roles[u] === "MINER") minerOrder.push(u);
          }
          const drawnNuggets = nuggetDeck.splice(0, order.length).sort((a, b) => b - a);
          minerOrder.forEach((uid, idx) => {
            scores[uid] = (scores[uid] || 0) + (drawnNuggets[idx] || 1);
          });
        } else if (winner === "SABOTEUR") {
          const saboList = order.filter(u => roles[u] === "SABOTEUR");
          let reward = 0;
          if (saboList.length === 1) reward = 4;
          else if (saboList.length >= 2 && saboList.length <= 3) reward = 3;
          else if (saboList.length >= 4) reward = 2;

          saboList.forEach(uid => {
            scores[uid] = (scores[uid] || 0) + reward;
          });
        }

        await update(ref(db, `saboteur_rooms/${currentRoomId}`), {
          scores: scores,
          nuggetDeck: nuggetDeck,
          roundScored: true
        });
      }

      const isFinal = (round >= 3);
      titleEl.textContent = isFinal ? "🏆 탐사 원정 최종 종료!" : `⛏️ ROUND ${round} 종료!`;
      noticeEl.innerHTML = `
        승리 진영: <strong style="color:#4a2b15;">${winner === "MINERS" ? "광부들 (금광 발견)" : "사보추어 (방해 성공)"}</strong><br>
        모든 광부의 역할이 공개되었습니다.
      `;

      scoresTable.innerHTML = `<div style="font-weight:700; color:#4a2b15; margin-bottom:4px;">[누적 금덩이 점수]</div>`;
      const finalOrder = Array.isArray(roomData.playerOrder) ? roomData.playerOrder : Object.values(roomData.playerOrder || {});
      finalOrder.forEach(uid => {
        const p = roomData.players[uid];
        const r = roomData.roles?.[uid];
        const sc = roomData.scores?.[uid] || 0;
        scoresTable.innerHTML += `
          <div style="display:flex; justify-content:space-between; margin-top:2px;">
            <span>${p ? p.name : uid} (${r === 'SABOTEUR' ? '사보추어' : '광부'}):</span>
            <strong style="color:#2a180b;">🪙 ${sc}개</strong>
          </div>
        `;
      });

      btnNext.style.display = "inline-block";
      if (isFinal) {
        btnNext.textContent = "로비로 돌아가기";
        btnNext.onclick = leaveRoom;
      } else {
        btnNext.textContent = isHost ? "다음 라운드 시작 ➔" : "방장의 다음 라운드 대기중...";
        btnNext.disabled = !isHost;
        btnNext.onclick = () => {
          modal.style.display = "none";
          startRound(round + 1);
        };
      }

      modal.style.display = "flex";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    switchView("lobby");
  </script>
</body>
