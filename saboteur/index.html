<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SABOTEUR ⛏️ (사보타지 실시간 멀티)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0c0d12;
      color: #e2e8f0;
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 6px;
      overflow-x: hidden;
    }

    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                  radial-gradient(circle, rgba(0,0,0,0) 65%, rgba(0,0,0,0.75) 100%);
      background-size: 100% 4px, 100% 100%;
      pointer-events: none;
      z-index: 300;
    }

    .game-cabinet {
      width: 100%;
      max-width: 1100px;
      height: 96vh;
      height: 96dvh;
      background: #151821;
      border: 3px solid #3b4252;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(241, 224, 90, 0.12), inset 0 0 20px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 공통 헤더 */
    header {
      height: 52px;
      background: #0d1017;
      border-bottom: 2px solid #2e3440;
      display: flex;
      padding: 6px 14px;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
    }
    .brand-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.8rem;
      color: #f1e05a;
      letter-spacing: 1px;
    }
    .user-pill {
      font-size: 0.8rem;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-section {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .view-section.active {
      display: flex;
    }

    /* 버튼 공통 */
    .btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-action { background: #f1e05a; color: #000; }
    .btn-danger { background: #da3633; color: #fff; }
    .btn-primary { background: #2ea043; color: #fff; }
    .btn-secondary { background: #2e3440; color: #fff; }

    /* [뷰 1: 로비 화면] */
    #view-lobby {
      padding: 16px;
      overflow-y: auto;
      gap: 16px;
    }
    .panel-box {
      background: #1c202a;
      border: 1px solid #2e3440;
      border-radius: 8px;
      padding: 14px;
    }
    .form-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    input, select {
      background: #0d1017;
      border: 1px solid #3b4252;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #f1e05a; }

    .room-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .room-item {
      background: #1c202a;
      border: 1px solid #2e3440;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .room-item:hover { border-color: #f1e05a; }

    /* [뷰 2: 게임/대기실 룸] */
    #view-room {
      overflow: hidden;
    }
    .room-topbar {
      height: 48px;
      background: #11141c;
      border-bottom: 1px solid #2e3440;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 14px;
      flex-shrink: 0;
    }
    .badge {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .badge-miner { background: #2ea043; color: #fff; }
    .badge-saboteur { background: #da3633; color: #fff; }
    .badge-turn { background: #f1e05a; color: #000; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }

    /* 대기실 패널 */
    #waiting-panel {
      padding: 12px 16px;
      background: #1a1e28;
      border-bottom: 2px solid #2e3440;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
      flex-wrap: wrap;
    }
    .waiting-player-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .player-chip {
      background: #11141c;
      border: 1px solid #2e3440;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .player-chip.ready { border-color: #2ea043; color: #2ea043; }

    /* 게임 보드 영역 */
    .playfield-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .board-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090b10;
      overflow: auto;
      padding: 10px;
    }
    .mine-grid {
      display: grid;
      grid-template-columns: repeat(9, clamp(44px, 5.8vw, 68px));
      grid-template-rows: repeat(5, clamp(44px, 5.8vw, 68px));
      gap: 3px;
      background: #1c202a;
      padding: 6px;
      border: 2px solid #2e3440;
      border-radius: 8px;
    }
    .grid-cell {
      background: #11141c;
      border: 1px solid #212634;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: background 0.15s, outline 0.15s;
    }
    .grid-cell.highlight-valid {
      outline: 2px dashed #2ea043;
      background: rgba(46, 160, 67, 0.25);
      cursor: crosshair;
    }
    .grid-cell.highlight-rockfall {
      outline: 2px dashed #da3633;
      background: rgba(218, 54, 51, 0.25);
    }
    .grid-cell.highlight-map {
      outline: 2px dashed #58a6ff;
      background: rgba(88, 166, 255, 0.25);
    }
    .grid-cell.tentative-tile {
      outline: 2px solid #f1e05a;
      filter: brightness(1.2);
    }

    .tile-svg {
      width: 100%;
      height: 100%;
      border-radius: 4px;
      pointer-events: none;
    }

    /* 우측 사이드바 */
    .sidebar {
      width: 240px;
      background: #0d1017;
      border-left: 2px solid #2e3440;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
      flex-shrink: 0;
    }
    .players-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 190px;
      overflow-y: auto;
    }
    .player-row {
      background: #161b24;
      border: 1px solid #2e3440;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .player-row.active-turn {
      border-color: #f1e05a;
      background: #252212;
    }

    /* 하단 패 & 액션 컨트롤 바 */
    .bottom-deck {
      height: 135px;
      background: #0d1017;
      border-top: 2px solid #2e3440;
      display: flex;
      padding: 6px 12px;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .cards-tray {
      flex: 1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      height: 100%;
      align-items: center;
      padding-bottom: 2px;
    }
    .card-item {
      width: 74px;
      height: 108px;
      background: #1a1e29;
      border: 2px solid #3b4252;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 4px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card-item:hover { transform: translateY(-4px); border-color: #f1e05a; }
    .card-item.selected {
      border-color: #58a6ff;
      transform: translateY(-8px);
      box-shadow: 0 0 12px rgba(88, 166, 255, 0.6);
    }
    .card-item.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .card-preview {
      width: 52px;
      height: 52px;
      background: #11141c;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-title {
      font-size: 0.55rem;
      font-weight: bold;
      text-align: center;
      color: #e2e8f0;
      line-height: 1.2;
    }

    .action-controls {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 140px;
      flex-shrink: 0;
    }

    /* 모달 공통 */
    .modal-backdrop {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 13, 18, 0.94);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 250;
      flex-direction: column;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 420px;
      background: #161b24;
      border: 3px solid #f1e05a;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    @media (max-width: 860px) {
      .game-cabinet { height: 100vh; height: 100dvh; border: none; border-radius: 0; }
      .sidebar { display: none; }
      .bottom-deck { height: 116px; padding: 4px 6px; gap: 6px; }
      .card-item { width: 58px; height: 96px; }
      .card-preview { width: 40px; height: 40px; }
      .action-controls { min-width: 110px; }
      .btn { font-size: 0.5rem; padding: 6px 6px; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <div class="game-cabinet">
    <header>
      <div class="brand-title">SABOTEUR ⛏️</div>
      <div class="user-pill">
        <span id="user-display-name">광부</span>
        <button id="btn-change-nickname" class="btn btn-secondary" style="padding:4px 8px; font-size:0.5rem;">닉네임 변경</button>
      </div>
    </header>

    <!-- [뷰 1: 로비 화면] -->
    <div id="view-lobby" class="view-section active">
      <div class="panel-box">
        <label style="font-size:0.85rem; color:#f1e05a; font-weight:bold;">새 광산 방 만들기 ⛏️</label>
        <div class="form-row">
          <input type="text" id="create-room-title" placeholder="방 제목 입력" style="flex:2; min-width:180px;">
          <select id="create-max-players" style="flex:1;">
            <option value="5">정원: 5명 (추천)</option>
            <option value="4">정원: 4명</option>
            <option value="6">정원: 6명</option>
            <option value="7">정원: 7명</option>
            <option value="8">정원: 8명</option>
            <option value="10">정원: 10명</option>
          </select>
          <button id="btn-create-room" class="btn btn-action" style="flex:1;">방 만들기</button>
        </div>
      </div>

      <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <label style="font-size:0.8rem; color:#8b949e; font-weight:bold;">진행 및 대기 중인 광산 목록</label>
        <div id="room-list" class="room-list">
          <p style="color:#666; font-size:0.8rem; padding:10px;">개설된 방이 없습니다. 새로운 방을 만들어보세요!</p>
        </div>
      </div>
    </div>

    <!-- [뷰 2: 게임 룸 화면 (대기 및 플레이)] -->
    <div id="view-room" class="view-section">
      <div class="room-topbar">
        <div style="display:flex; align-items:center; gap:8px;">
          <strong id="room-title-label" style="font-size:0.85rem; color:#fff;">방 제목</strong>
          <span id="roleBadge" class="badge" style="display:none;">역할</span>
        </div>
        <div class="game-stats">
          <span>남은 덱: <strong id="deckRemainText" style="color:#58a6ff;">-</strong>장</span>
          <span id="turnIndicator" class="badge badge-turn" style="display:none;">내 턴!</span>
          <button id="btn-leave-room" class="btn btn-danger" style="padding:4px 8px; font-size:0.5rem;">방 나가기 🚪</button>
        </div>
      </div>

      <!-- 대기실 상태 바 (방장 시작 / 참가자 레디) -->
      <div id="waiting-panel">
        <div class="waiting-player-chips" id="waiting-player-chips"></div>
        <div style="display:flex; gap:6px; align-items:center;">
          <button id="btn-ready-toggle" class="btn btn-primary">레디</button>
          <button id="btn-host-start" class="btn btn-action" style="display:none;">탐사 시작! ⛏️</button>
        </div>
      </div>

      <!-- 메인 보드 & 사이드바 -->
      <div class="playfield-body">
        <div class="board-container">
          <div id="mineGrid" class="mine-grid"></div>
        </div>

        <div class="sidebar">
          <div style="font-size:0.75rem; color:#f1e05a; font-weight:bold; border-bottom:1px solid #2e3440; padding-bottom:4px;">참가 광부 목록</div>
          <div id="playersList" class="players-list"></div>
          <div id="gameLogBox" style="flex:1; background:#11141c; border:1px solid #2e3440; border-radius:6px; padding:6px; font-size:0.65rem; color:#8b949e; overflow-y:auto;">
            [안내] 방에 입장했습니다.
          </div>
        </div>
      </div>

      <!-- 하단 패 & 컨트롤 -->
      <div class="bottom-deck">
        <div id="cardsTray" class="cards-tray"></div>
        <div class="action-controls">
          <div style="display:flex; gap:4px;">
            <button id="btnRotateCard" class="btn btn-action" style="flex:1;" disabled>회전 🔄</button>
            <button id="btnDiscardCard" class="btn btn-danger" style="flex:1;" disabled>버리기 🗑️</button>
          </div>
          <button id="btnConfirmTurn" class="btn btn-primary" style="display:none;">턴 마치기 ➔</button>
          <button id="btnUndoAction" class="btn btn-secondary" style="display:none;">취소 (무르기) ↩️</button>
        </div>
      </div>
    </div>

    <!-- 대상 지정 모달 (도구 파괴/수리) -->
    <div id="targetPlayerModal" class="modal-backdrop">
      <div class="modal-box">
        <h3 id="targetModalTitle" style="font-family:'Press Start 2P', cursive; font-size:0.75rem; color:#f1e05a;"></h3>
        <div id="targetPlayersList" style="display:flex; flex-direction:column; gap:6px; margin:8px 0;"></div>
        <button id="btnCloseTargetModal" class="btn btn-danger">취소</button>
      </div>
    </div>

    <!-- 결과 모달 -->
    <div id="resultModal" class="modal-backdrop">
      <div class="modal-box">
        <h2 id="resultTitle" style="font-family:'Press Start 2P', cursive; font-size:1rem;"></h2>
        <p id="resultDesc" style="font-size:0.8rem; color:#ccc; line-height:1.5;"></p>
        <button id="btnReturnLobby" class="btn btn-action" style="margin-top:8px;">로비로 돌아가기</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getDatabase, ref, set, update, onValue, get, remove, onDisconnect 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsvhq6Y1KzvUJ9gUlF6_QEgYoj-FzuZMU",
      authDomain: "relaynovelphobia.firebaseapp.com",
      databaseURL: "https://relaynovelphobia-default-rtdb.firebaseio.com",
      projectId: "relaynovelphobia",
      appId: "1:365170091282:web:6956889d54eea4070bbfcb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ──────────────────────────────────────────────────
    // [1] 사운드 엔진
    // ──────────────────────────────────────────────────
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playTone(freq, duration = 0.08, type = "square", endFreq = null) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
    const SFX = {
      tile: () => playTone(350, 0.08, "triangle", 180),
      action: () => playTone(500, 0.12, "sine", 750),
      gold: () => [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.12, "triangle"), i * 80)),
      rockfall: () => playTone(140, 0.3, "sawtooth", 40)
    };

    // ──────────────────────────────────────────────────
    // [2] 룰 및 타일 규격
    // ──────────────────────────────────────────────────
    const PATH_TYPES = {
      cross: { t: true, r: true, b: true, l: true, dead: false },
      t_down: { t: false, r: true, b: true, l: true, dead: false },
      t_up: { t: true, r: true, b: false, l: true, dead: false },
      straight_h: { t: false, r: true, b: false, l: true, dead: false },
      straight_v: { t: true, r: false, b: true, l: false, dead: false },
      curve_rb: { t: false, r: true, b: true, l: false, dead: false },
      curve_lb: { t: false, r: false, b: true, l: true, dead: false },
      curve_rt: { t: true, r: true, b: false, l: false, dead: false },
      curve_lt: { t: true, r: false, b: false, l: true, dead: false },
      dead_cross: { t: true, r: true, b: true, l: true, dead: true },
      dead_h: { t: false, r: true, b: false, l: true, dead: true },
      dead_v: { t: true, r: false, b: true, l: false, dead: true },
      dead_t_down: { t: false, r: true, b: true, l: true, dead: true },
      dead_curve_rb: { t: false, r: true, b: true, l: false, dead: true }
    };

    function createInitialGrid() {
      const grid = {};
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 9; c++) {
          grid[`${r}_${c}`] = null;
        }
      }
      grid["2_0"] = { type: "cross", ...PATH_TYPES.cross, fixed: true };

      const goals = ["GOLD", "COAL", "COAL"].sort(() => 0.5 - Math.random());
      grid["0_8"] = { type: "goal", hidden: true, realType: goals[0] };
      grid["2_8"] = { type: "goal", hidden: true, realType: goals[1] };
      grid["4_8"] = { type: "goal", hidden: true, realType: goals[2] };
      return grid;
    }

    function createOfficialDeck() {
      const deck = [];
      const openKeys = ["cross", "t_down", "t_up", "straight_h", "straight_v", "curve_rb", "curve_lb", "curve_rt", "curve_lt"];
      const deadKeys = ["dead_cross", "dead_h", "dead_v", "dead_t_down", "dead_curve_rb"];

      for (let i = 0; i < 35; i++) {
        const k = openKeys[i % openKeys.length];
        deck.push({ kind: "path", pathKey: k, ...PATH_TYPES[k], name: "길 타일" });
      }
      for (let i = 0; i < 9; i++) {
        const k = deadKeys[i % deadKeys.length];
        deck.push({ kind: "path", pathKey: k, ...PATH_TYPES[k], name: "막힌 길" });
      }

      for (let i = 0; i < 6; i++) deck.push({ kind: "action", actionType: "map", name: "지도 🗺️" });
      for (let i = 0; i < 3; i++) deck.push({ kind: "action", actionType: "rockfall", name: "낙석 🪨" });
      for (let i = 0; i < 9; i++) deck.push({ kind: "action", actionType: "break_pick", name: "곡괭이 파괴 🔨" });
      for (let i = 0; i < 9; i++) deck.push({ kind: "action", actionType: "fix_pick", name: "곡괭이 수리 🛠️" });

      return deck.sort(() => 0.5 - Math.random());
    }

    // ──────────────────────────────────────────────────
    // [3] 사용자 & 세션 관리 (단일 기기 세션 보장)
    // ──────────────────────────────────────────────────
    let myUid = localStorage.getItem("saboteur_uid") || ("user_" + Math.random().toString(36).substr(2, 6));
    let myName = localStorage.getItem("saboteur_nickname") || "광부_" + myUid.substr(5, 3);
    let mySessionId = Date.now() + "_" + Math.random().toString(36).substr(2, 6);

    localStorage.setItem("saboteur_uid", myUid);
    localStorage.setItem("saboteur_nickname", myName);
    sessionStorage.setItem("saboteur_session_id", mySessionId);

    const userDisplayName = document.getElementById("user-display-name");
    userDisplayName.textContent = myName;

    // 세션 토큰 감시 (다른 창/기기 중복 로그인 차단)
    set(ref(db, `saboteur_sessions/${myUid}`), mySessionId);
    onValue(ref(db, `saboteur_sessions/${myUid}`), (snap) => {
      const activeSession = snap.val();
      if (activeSession && activeSession !== mySessionId) {
        alert("다른 기기 또는 다른 탭에서 접속하여 이 창의 연결이 종료됩니다.");
        leaveRoom();
        location.reload();
      }
    });

    document.getElementById("btn-change-nickname").addEventListener("click", () => {
      const input = prompt("사용할 광부 닉네임을 입력하세요:", myName);
      if (input && input.trim()) {
        myName = input.trim();
        localStorage.setItem("saboteur_nickname", myName);
        userDisplayName.textContent = myName;
        if (currentRoomId) {
          update(ref(db, `saboteur_rooms/${currentRoomId}/players/${myUid}`), { name: myName });
        }
      }
    });

    // ──────────────────────────────────────────────────
    // [4] 게임 상태
    // ──────────────────────────────────────────────────
    let currentRoomId = null;
    let roomData = null;
    let roomListenerUnsub = null;
    let selectedCardIdx = null;
    let selectedCardRotation = 0;
    let tentativeAction = null;

    const views = {
      lobby: document.getElementById("view-lobby"),
      room: document.getElementById("view-room")
    };

    function switchView(viewName) {
      Object.keys(views).forEach(k => views[k].classList.remove("active"));
      if (views[viewName]) views[viewName].classList.add("active");
    }

    // ──────────────────────────────────────────────────
    // [5] 로비 방 목록 실시간 동기화
    // ──────────────────────────────────────────────────
    const roomListContainer = document.getElementById("room-list");

    onValue(ref(db, "saboteur_rooms"), (snapshot) => {
      const rooms = snapshot.val();
      roomListContainer.innerHTML = "";
      if (!rooms) {
        roomListContainer.innerHTML = `<p style="color:#666; font-size:0.8rem; padding:10px;">개설된 방이 없습니다. 새로운 방을 만들어보세요!</p>`;
        return;
      }

      Object.entries(rooms).forEach(([rId, r]) => {
        const pList = r.players ? Object.values(r.players) : [];
        if (pList.length === 0) {
          remove(ref(db, `saboteur_rooms/${rId}`));
          return;
        }

        const isFull = (pList.length >= (r.maxPlayers || 5));
        const isPlaying = (r.status === "PLAYING");

        const div = document.createElement("div");
        div.className = "room-item";
        div.innerHTML = `
          <div>
            <strong style="color:#f1e05a;">${escapeHtml(r.title)}</strong>
            <div style="font-size:0.75rem; color:#8b949e; margin-top:3px;">
              인원: ${pList.length}/${r.maxPlayers || 5}명 · ${isPlaying ? '탐사중' : '대기중'}
            </div>
          </div>
          <button class="btn btn-action" ${isFull || isPlaying ? 'disabled' : ''}>
            ${isPlaying ? '진행중' : (isFull ? '만원' : '입장')}
          </button>
        `;

        if (!isFull && !isPlaying) {
          div.querySelector("button").addEventListener("click", () => joinRoom(rId));
        }

        roomListContainer.appendChild(div);
      });
    });

    // 방 만들기
    document.getElementById("btn-create-room").addEventListener("click", async () => {
      const titleInput = document.getElementById("create-room-title");
      const title = titleInput.value.trim() || `${myName}의 금광`;
      const maxPlayers = parseInt(document.getElementById("create-max-players").value, 10) || 5;

      const newRoomRef = ref(db, `saboteur_rooms/${Date.now().toString(36)}`);
      const rId = newRoomRef.key;

      const newRoomData = {
        id: rId,
        title: title,
        maxPlayers: maxPlayers,
        status: "WAITING",
        hostUid: myUid,
        players: {
          [myUid]: {
            id: myUid,
            name: myName,
            isReady: true,
            joinedAt: Date.now()
          }
        },
        playerOrder: [myUid],
        grid: null,
        deck: null,
        hands: null,
        roles: null,
        turnIdx: 0,
        brokenPicks: {}
      };

      await set(newRoomRef, newRoomData);
      titleInput.value = "";
      joinRoom(rId);
    });

    // 방 입장
    async function joinRoom(rId) {
      currentRoomId = rId;
      const roomRef = ref(db, `saboteur_rooms/${rId}`);
      const snap = await get(roomRef);

      if (!snap.exists()) {
        alert("존재하지 않거나 삭제된 방입니다.");
        return;
      }

      const r = snap.val();
      const pCount = Object.keys(r.players || {}).length;
      if (r.status !== "WAITING" && !r.players?.[myUid]) {
        alert("이미 게임이 시작된 방입니다.");
        return;
      }
      if (pCount >= (r.maxPlayers || 5) && !r.players?.[myUid]) {
        alert("정원이 가득 찬 방입니다.");
        return;
      }

      const isHost = (r.hostUid === myUid);
      const playerRef = ref(db, `saboteur_rooms/${rId}/players/${myUid}`);

      await update(playerRef, {
        id: myUid,
        name: myName,
        isReady: isHost ? true : false,
        joinedAt: Date.now()
      });

      // 비정상 종료 시 자동 퇴장
      onDisconnect(playerRef).remove();

      switchView("room");
      listenToCurrentRoom(rId);
    }

    // 방 나가기
    function leaveRoom() {
      if (currentRoomId) {
        remove(ref(db, `saboteur_rooms/${currentRoomId}/players/${myUid}`)).then(() => {
          get(ref(db, `saboteur_rooms/${currentRoomId}/players`)).then(snap => {
            const players = snap.val() || {};
            const pIds = Object.keys(players);
            if (pIds.length === 0) {
              remove(ref(db, `saboteur_rooms/${currentRoomId}`));
            } else if (roomData && roomData.hostUid === myUid) {
              // 방장 자동 위임
              update(ref(db, `saboteur_rooms/${currentRoomId}`), { hostUid: pIds[0] });
            }
          });
        });
      }

      currentRoomId = null;
      roomData = null;
      selectedCardIdx = null;
      tentativeAction = null;
      document.getElementById("resultModal").style.display = "none";
      switchView("lobby");
    }

    document.getElementById("btn-leave-room").addEventListener("click", () => {
      if (confirm("정말 방에서 나가시겠습니까?")) {
        leaveRoom();
      }
    });

    document.getElementById("btnReturnLobby").addEventListener("click", leaveRoom);

    // ──────────────────────────────────────────────────
    // [6] 방 실시간 리스너 및 렌더링
    // ──────────────────────────────────────────────────
    function listenToCurrentRoom(rId) {
      const roomRef = ref(db, `saboteur_rooms/${rId}`);
      onValue(roomRef, (snap) => {
        roomData = snap.val();
        if (!roomData) {
          alert("방이 종료되었거나 폭파되었습니다.");
          leaveRoom();
          return;
        }

        const players = roomData.players || {};
        const pIds = Object.keys(players);

        // 방장 자동 정리
        if (!players[roomData.hostUid] && pIds.length > 0) {
          update(roomRef, { hostUid: pIds[0] });
          return;
        }

        renderRoomUI();
      });
    }

    function renderRoomUI() {
      const isHost = (roomData.hostUid === myUid);
      const players = roomData.players || {};
      const pIds = Object.keys(players);

      document.getElementById("room-title-label").textContent = roomData.title;

      // 1. 대기실 상태
      if (roomData.status === "WAITING") {
        document.getElementById("waiting-panel").style.display = "flex";
        document.getElementById("roleBadge").style.display = "none";
        document.getElementById("turnIndicator").style.display = "none";
        document.getElementById("deckRemainText").textContent = "-";

        const chipsEl = document.getElementById("waiting-player-chips");
        chipsEl.innerHTML = "";

        let allOthersReady = true;
        pIds.forEach(pId => {
          const p = players[pId];
          const isPlayerHost = (pId === roomData.hostUid);
          const chip = document.createElement("div");
          chip.className = `player-chip ${p.isReady ? 'ready' : ''}`;
          chip.innerHTML = `${isPlayerHost ? '👑' : ''} ${escapeHtml(p.name)} [${p.isReady ? '레디' : '대기'}]`;
          chipsEl.appendChild(chip);

          if (!isPlayerHost && !p.isReady) {
            allOthersReady = false;
          }
        });

        const btnReady = document.getElementById("btn-ready-toggle");
        const btnStart = document.getElementById("btn-host-start");

        if (isHost) {
          btnReady.style.display = "none";
          btnStart.style.display = "inline-block";
          // 3명 이상일 때 원작 룰에 부합하지만, 테스트 편의를 위해 최소 1명부터 허용
          btnStart.disabled = (pIds.length > 1 && !allOthersReady);
        } else {
          btnStart.style.display = "none";
          btnReady.style.display = "inline-block";
          const myReady = players[myUid]?.isReady || false;
          btnReady.textContent = myReady ? "준비 취소" : "레디";
          btnReady.className = `btn ${myReady ? 'btn-danger' : 'btn-primary'}`;
        }

        renderBoardEmptyPreview();
        return;
      }

      // 2. 게임 플레이 상태
      document.getElementById("waiting-panel").style.display = "none";

      renderPlayersUI();
      renderHandUI();
      renderBoardUI();

      if (roomData.status === "FINISHED") {
        const winner = roomData.winner;
        const myRole = roomData.roles?.[myUid];
        const isWin = (winner === "MINERS" && myRole === "MINER") || (winner === "SABOTEUR" && myRole === "SABOTEUR");

        document.getElementById("resultTitle").textContent = isWin ? "🎉 탐사 성공 (승리)!" : "💀 탐사 실패 (패배)...";
        document.getElementById("resultTitle").style.color = isWin ? "#2ea043" : "#da3633";
        document.getElementById("resultDesc").innerHTML = `
          승리 진영: <strong>${winner === "MINERS" ? "선량한 광부들" : "사보추어(방해꾼)"}</strong><br>
          내 역할: <strong>${myRole === "SABOTEUR" ? "사보추어 💣" : "광부 ⛏️"}</strong>
        `;
        document.getElementById("resultModal").style.display = "flex";
      }
    }

    // 대기 중 빈 보드 렌더링
    function renderBoardEmptyPreview() {
      const mineGridEl = document.getElementById("mineGrid");
      mineGridEl.innerHTML = "";
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement("div");
          cell.className = "grid-cell";
          if (r === 2 && c === 0) cell.innerHTML = renderTileSVG({ type: "cross", ...PATH_TYPES.cross, fixed: true });
          if ((r === 0 || r === 2 || r === 4) && c === 8) cell.innerHTML = renderTileSVG({ type: "goal", hidden: true });
          mineGridEl.appendChild(cell);
        }
      }
      document.getElementById("cardsTray").innerHTML = `<span style="font-size:0.7rem; color:#888; margin:auto;">게임 시작 후 카드가 지급됩니다.</span>`;
    }

    // 방장 시작 (공식 인원수별 카드 분배 & 사보추어 배정)
    document.getElementById("btn-host-start").addEventListener("click", async () => {
      const order = Object.keys(roomData.players || []);
      const pCount = order.length;
      if (pCount < 1) return alert("최소 1명 이상이어야 합니다.");

      // 공식 인원수별 장수
      let handSize = 6;
      if (pCount >= 8) handSize = 4;
      else if (pCount >= 6) handSize = 5;
      else handSize = 6;

      // 공식 인원수별 사보추어 수 (3~4인: 1명, 5~6인: 2명, 7인 이상: 3명)
      let saboCount = 1;
      if (pCount >= 7) saboCount = 3;
      else if (pCount >= 5) saboCount = 2;

      const shuffledOrder = [...order].sort(() => 0.5 - Math.random());
      const roles = {};
      order.forEach(uid => roles[uid] = "MINER");
      for (let i = 0; i < saboCount; i++) {
        if (shuffledOrder[i]) roles[shuffledOrder[i]] = "SABOTEUR";
      }

      const fullDeck = createOfficialDeck();
      const hands = {};
      order.forEach(uid => {
        hands[uid] = fullDeck.splice(0, handSize);
      });

      const updates = {
        status: "PLAYING",
        grid: createInitialGrid(),
        deck: fullDeck,
        hands: hands,
        roles: roles,
        playerOrder: order,
        turnIdx: 0,
        brokenPicks: {}
      };

      await update(ref(db, `saboteur_rooms/${currentRoomId}`), updates);
    });

    // 레디 토글
    document.getElementById("btn-ready-toggle").addEventListener("click", () => {
      const cur = roomData.players[myUid]?.isReady || false;
      update(ref(db, `saboteur_rooms/${currentRoomId}/players/${myUid}`), { isReady: !cur });
    });

    // ──────────────────────────────────────────────────
    // [7] 보드판 & 조작 UI 렌더러
    // ──────────────────────────────────────────────────
    const mineGridEl = document.getElementById("mineGrid");
    const cardsTrayEl = document.getElementById("cardsTray");
    const playersListEl = document.getElementById("playersList");
    const btnRotateCard = document.getElementById("btnRotateCard");
    const btnDiscardCard = document.getElementById("btnDiscardCard");
    const btnConfirmTurn = document.getElementById("btnConfirmTurn");
    const btnUndoAction = document.getElementById("btnUndoAction");

    function renderBoardUI() {
      if (!roomData || !roomData.grid) return;
      const baseGrid = roomData.grid;
      mineGridEl.innerHTML = "";

      const displayGrid = { ...baseGrid };
      if (tentativeAction && tentativeAction.type === "PLACE") {
        displayGrid[`${tentativeAction.r}_${tentativeAction.c}`] = tentativeAction.tile;
      }

      const myCard = (selectedCardIdx !== null) ? roomData.hands?.[myUid]?.[selectedCardIdx] : null;
      const isMyTurn = (roomData.playerOrder?.[roomData.turnIdx] === myUid);
      const isPickBroken = roomData.brokenPicks?.[myUid] === true;
      const hasTentative = Boolean(tentativeAction);

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 9; c++) {
          const cellKey = `${r}_${c}`;
          const tile = displayGrid[cellKey];
          const cell = document.createElement("div");
          cell.className = "grid-cell";

          if (tile) {
            cell.innerHTML = renderTileSVG(tile);
            if (tentativeAction && tentativeAction.type === "PLACE" && tentativeAction.r === r && tentativeAction.c === c) {
              cell.classList.add("tentative-tile");
            }

            if (!hasTentative && isMyTurn && myCard?.actionType === "rockfall" && !tile.fixed && tile.type !== "goal") {
              cell.classList.add("highlight-rockfall");
              cell.addEventListener("click", () => setupRockfallAction(r, c));
            }
            if (!hasTentative && isMyTurn && myCard?.actionType === "map" && tile.type === "goal" && tile.hidden) {
              cell.classList.add("highlight-map");
              cell.addEventListener("click", () => setupMapAction(tile));
            }
          } else {
            if (!hasTentative && isMyTurn && myCard?.kind === "path" && !isPickBroken) {
              const rotated = getRotatedTile(myCard, selectedCardRotation);
              if (isValidTilePlacement(displayGrid, r, c, rotated)) {
                cell.classList.add("highlight-valid");
                cell.addEventListener("click", () => setupPlacementAction(r, c, rotated));
              }
            }
          }

          mineGridEl.appendChild(cell);
        }
      }
    }

    function renderHandUI() {
      if (!roomData || !roomData.hands) return;
      const hand = roomData.hands[myUid] || [];
      cardsTrayEl.innerHTML = "";

      const isMyTurn = (roomData.playerOrder?.[roomData.turnIdx] === myUid);
      const hasTentative = Boolean(tentativeAction);

      hand.forEach((card, idx) => {
        const isTentativeCard = (tentativeAction && tentativeAction.cardIdx === idx);
        const item = document.createElement("div");
        item.className = `card-item ${selectedCardIdx === idx ? "selected" : ""} ${isTentativeCard ? "disabled" : ""}`;

        let previewHTML = "";
        if (card.kind === "path") {
          const previewTile = getRotatedTile(card, selectedCardIdx === idx ? selectedCardRotation : 0);
          previewHTML = `<div class="card-preview">${renderTileSVG(previewTile)}</div>`;
        } else {
          let icon = "🗺️";
          if (card.actionType === "rockfall") icon = "🪨";
          else if (card.actionType === "break_pick") icon = "🔨";
          else if (card.actionType === "fix_pick") icon = "🛠️";
          previewHTML = `<div class="card-preview" style="font-size:1.6rem;">${icon}</div>`;
        }

        item.innerHTML = `
          ${previewHTML}
          <div class="card-title">${card.name || (card.dead ? "막힌길" : "길 타일")}</div>
        `;

        item.addEventListener("click", () => {
          if (!isMyTurn || hasTentative) return;
          if (selectedCardIdx === idx) {
            selectedCardIdx = null;
          } else {
            selectedCardIdx = idx;
            selectedCardRotation = 0;
            if (card.actionType === "break_pick" || card.actionType === "fix_pick") {
              openTargetPlayerModal(card.actionType);
            }
          }
          updateControlButtons();
          renderHandUI();
          renderBoardUI();
        });

        cardsTrayEl.appendChild(item);
      });

      updateControlButtons();
    }

    function updateControlButtons() {
      const isMyTurn = (roomData?.playerOrder?.[roomData?.turnIdx] === myUid);
      const hasTentative = Boolean(tentativeAction);
      const hasCardSelected = (selectedCardIdx !== null);

      if (hasTentative) {
        btnConfirmTurn.style.display = "block";
        btnUndoAction.style.display = "block";
        btnRotateCard.style.display = "none";
        btnDiscardCard.style.display = "none";
      } else {
        btnConfirmTurn.style.display = "none";
        btnUndoAction.style.display = "none";
        btnRotateCard.style.display = "block";
        btnDiscardCard.style.display = "block";

        btnDiscardCard.disabled = !isMyTurn || !hasCardSelected;
        btnRotateCard.disabled = !isMyTurn || !hasCardSelected || (roomData?.hands?.[myUid]?.[selectedCardIdx]?.kind !== "path");
      }
    }

    btnRotateCard.addEventListener("click", () => {
      selectedCardRotation = (selectedCardRotation === 0) ? 180 : 0;
      renderHandUI();
      renderBoardUI();
    });

    btnDiscardCard.addEventListener("click", () => {
      if (selectedCardIdx === null) return;
      tentativeAction = {
        type: "DISCARD",
        cardIdx: selectedCardIdx
      };
      selectedCardIdx = null;
      renderHandUI();
      renderBoardUI();
    });

    btnUndoAction.addEventListener("click", () => {
      tentativeAction = null;
      selectedCardIdx = null;
      selectedCardRotation = 0;
      renderHandUI();
      renderBoardUI();
    });

    // 턴 마치기 확정
    btnConfirmTurn.addEventListener("click", async () => {
      if (!tentativeAction) return;
      btnConfirmTurn.disabled = true;

      const action = tentativeAction;
      const hand = [...(roomData.hands?.[myUid] || [])];
      hand.splice(action.cardIdx, 1);

      const deck = [...(roomData.deck || [])];
      if (deck.length > 0) {
        hand.push(deck.pop());
      }

      const order = roomData.playerOrder || [];
      const nextTurnIdx = (roomData.turnIdx + 1) % order.length;

      const updates = {
        ...action.extraUpdates,
        [`hands/${myUid}`]: hand,
        deck: deck,
        turnIdx: nextTurnIdx
      };

      let allHandsEmpty = (hand.length === 0);
      order.forEach(uid => {
        if (uid !== myUid && (roomData.hands?.[uid] || []).length > 0) {
          allHandsEmpty = false;
        }
      });
      if (deck.length === 0 && allHandsEmpty) {
        updates.status = "FINISHED";
        updates.winner = "SABOTEUR";
      }

      tentativeAction = null;
      selectedCardIdx = null;
      selectedCardRotation = 0;

      await update(ref(db, `saboteur_rooms/${currentRoomId}`), updates);
      btnConfirmTurn.disabled = false;
    });

    function setupPlacementAction(r, c, tile) {
      SFX.tile();
      const updates = {};
      updates[`grid/${r}_${c}`] = tile;

      const neighbors = [
        { r: r - 1, c: c, dir: "t" },
        { r: r + 1, c: c, dir: "b" },
        { r: r, c: c - 1, dir: "l" },
        { r: r, c: c + 1, dir: "r" }
      ];

      for (const n of neighbors) {
        if (n.r < 0 || n.r >= 5 || n.c < 0 || n.c >= 9) continue;
        const target = roomData.grid?.[`${n.r}_${n.c}`];
        if (target && target.type === "goal" && target.hidden && tile[n.dir]) {
          updates[`grid/${n.r}_${n.c}/hidden`] = false;
          if (target.realType === "GOLD") {
            updates.status = "FINISHED";
            updates.winner = "MINERS";
            SFX.gold();
          }
        }
      }

      tentativeAction = {
        type: "PLACE",
        cardIdx: selectedCardIdx,
        r: r,
        c: c,
        tile: tile,
        extraUpdates: updates
      };

      selectedCardIdx = null;
      renderHandUI();
      renderBoardUI();
    }

    function setupRockfallAction(r, c) {
      SFX.rockfall();
      tentativeAction = {
        type: "ACTION",
        cardIdx: selectedCardIdx,
        extraUpdates: { [`grid/${r}_${c}`]: null }
      };
      selectedCardIdx = null;
      renderHandUI();
      renderBoardUI();
    }

    function setupMapAction(tile) {
      alert(`🗺️ [지도 확인 결과]\n해당 목적지는 [${tile.realType === "GOLD" ? "⭐ 진짜 금광!" : "❌ 석탄(돌)"}] 입니다!`);
      tentativeAction = {
        type: "ACTION",
        cardIdx: selectedCardIdx,
        extraUpdates: {}
      };
      selectedCardIdx = null;
      renderHandUI();
      renderBoardUI();
    }

    function openTargetPlayerModal(actionType) {
      const modal = document.getElementById("targetPlayerModal");
      const listEl = document.getElementById("targetPlayersList");
      const titleEl = document.getElementById("targetModalTitle");
      listEl.innerHTML = "";

      const isBreak = (actionType === "break_pick");
      titleEl.textContent = isBreak ? "🔨 곡괭이를 파괴할 대상 선택" : "🛠️ 곡괭이를 수리할 대상 선택";

      const order = roomData.playerOrder || [];
      order.forEach(uid => {
        const p = roomData.players?.[uid];
        const isBroken = roomData.brokenPicks?.[uid] === true;

        if (isBreak && isBroken) return;
        if (!isBreak && !isBroken) return;

        const btn = document.createElement("button");
        btn.className = "btn btn-action";
        btn.textContent = `${p.name} ${uid === myUid ? '(나)' : ''}`;
        btn.addEventListener("click", () => {
          modal.style.display = "none";
          SFX.action();
          tentativeAction = {
            type: "ACTION",
            cardIdx: selectedCardIdx,
            extraUpdates: { [`brokenPicks/${uid}`]: isBreak ? true : null }
          };
          selectedCardIdx = null;
          renderHandUI();
          renderBoardUI();
        });
        listEl.appendChild(btn);
      });

      if (listEl.children.length === 0) {
        listEl.innerHTML = `<div style="font-size:0.7rem; color:#888;">적용 가능한 대상이 없습니다.</div>`;
      }

      modal.style.display = "flex";
    }

    document.getElementById("btnCloseTargetModal").addEventListener("click", () => {
      document.getElementById("targetPlayerModal").style.display = "none";
      selectedCardIdx = null;
      renderHandUI();
      renderBoardUI();
    });

    function renderPlayersUI() {
      if (!roomData || !roomData.players) return;
      playersListEl.innerHTML = "";
      const order = roomData.playerOrder || [];
      const currentTurnUid = order[roomData.turnIdx];

      order.forEach(uid => {
        const p = roomData.players[uid];
        if (!p) return;
        const row = document.createElement("div");
        row.className = `player-row ${uid === currentTurnUid ? "active-turn" : ""}`;
        const isBroken = roomData.brokenPicks?.[uid] === true;

        row.innerHTML = `
          <span>${uid === currentTurnUid ? "👉 " : ""}${escapeHtml(p.name)} ${uid === myUid ? "(나)" : ""}</span>
          <div>${isBroken ? '<span style="color:#da3633;">🔨고장</span>' : '<span style="color:#2ea043;">✔️정상</span>'}</div>
        `;
        playersListEl.appendChild(row);
      });

      const myRole = roomData.roles?.[myUid];
      const roleBadge = document.getElementById("roleBadge");
      if (myRole) {
        roleBadge.style.display = "inline-block";
        roleBadge.textContent = (myRole === "SABOTEUR") ? "사보추어 💣" : "선량한 광부 ⛏️";
        roleBadge.className = `badge ${myRole === "SABOTEUR" ? "badge-saboteur" : "badge-miner"}`;
      }

      document.getElementById("deckRemainText").textContent = (roomData.deck || []).length;
      document.getElementById("turnIndicator").style.display = (currentTurnUid === myUid) ? "inline-block" : "none";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // 초기 실행
    switchView("lobby");
  </script>
</body>
</html>
